<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="437" viewBox="0 0 1040 437" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Optional bridge to a ROS 2 graph</title>
  <desc id="desc">Robot Bus nodes exchange Protobuf with their broker. A bridge process contains a Bus Node, a typed mapper and a native ROS client. The ROS client joins an existing Humble or Jazzy DDS graph. Each route has a configured data or request direction; service responses and action feedback and results return to the caller.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    </style>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#255987"/>
    </marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#65408a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1038" height="435" rx="18" fill="#f5f9f8" stroke="#cedddb"/>
  <text x="32" y="53" fill="#172d33" font-size="28" font-weight="700" text-anchor="start">Optional bridge to a ROS 2 graph</text>
  <rect x="32" y="78" width="238" height="228" rx="12" fill="#edf5fb" stroke="#cedddb"/>
  <text x="48" y="108" fill="#255987" font-size="20" font-weight="700" text-anchor="start">Robot Bus</text>
  <rect x="48" y="126" width="206" height="70" rx="10" fill="#fff" stroke="#cedddb"/>
  <text x="64" y="155" fill="#255987" font-size="19" font-weight="700" text-anchor="start">Bus nodes</text>
  <text x="64" y="179" fill="#435961" font-size="15" font-weight="400" text-anchor="start">Any Robot Bus SDK</text>
  <path d="M151 201 V224" fill="none" stroke="#255987" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
  <rect x="48" y="228" width="206" height="63" rx="10" fill="#fff" stroke="#cedddb"/>
  <text x="64" y="257" fill="#255987" font-size="19" font-weight="700" text-anchor="start">Broker</text>
  <text x="64" y="281" fill="#435961" font-size="15" font-weight="400" text-anchor="start">Protobuf</text>
  <rect x="316" y="78" width="408" height="228" rx="12" fill="#eaf5ef" stroke="#b6cec4"/>
  <text x="332" y="108" fill="#12644e" font-size="20" font-weight="700" text-anchor="start">Bridge process</text>
  <text x="332" y="137" fill="#435961" font-size="15" font-weight="400" text-anchor="start">Python / rclpy · Rust / rclrs · C++ / rclcpp</text>
  <rect x="332" y="222" width="115" height="70" rx="10" fill="#fff" stroke="#cedddb"/>
  <text x="389.5" y="251" fill="#12644e" font-size="19" font-weight="700" text-anchor="middle">Bus Node</text>
  <text x="389.5" y="275" fill="#435961" font-size="15" font-weight="400" text-anchor="middle">Protobuf</text>
  <rect x="462" y="222" width="115" height="70" rx="10" fill="#fff" stroke="#cedddb"/>
  <text x="519.5" y="251" fill="#12644e" font-size="19" font-weight="700" text-anchor="middle">Mapper</text>
  <text x="519.5" y="275" fill="#435961" font-size="15" font-weight="400" text-anchor="middle">Typed fields</text>
  <rect x="592" y="222" width="115" height="70" rx="10" fill="#fff" stroke="#cedddb"/>
  <text x="649.5" y="251" fill="#12644e" font-size="19" font-weight="700" text-anchor="middle">ROS client</text>
  <text x="649.5" y="275" fill="#435961" font-size="15" font-weight="400" text-anchor="middle">ROS messages</text>
  <path d="M448 257 H460" fill="none" stroke="#12644e" stroke-width="2"/>
  <path d="M578 257 H590" fill="none" stroke="#12644e" stroke-width="2"/>
  <text x="520" y="175" fill="#12644e" font-size="16" font-weight="700" text-anchor="middle">Each route picks one direction</text>
  <text x="520" y="200" fill="#12644e" font-size="16" font-weight="700" text-anchor="middle">ROS → Bus   /   Bus → ROS</text>
  <rect x="770" y="78" width="238" height="228" rx="12" fill="#f5f0fa" stroke="#cedddb"/>
  <text x="786" y="108" fill="#65408a" font-size="20" font-weight="700" text-anchor="start">ROS 2 graph</text>
  <text x="786" y="137" fill="#435961" font-size="15" font-weight="400" text-anchor="start">Humble / Jazzy</text>
  <rect x="786" y="222" width="206" height="70" rx="10" fill="#fff" stroke="#cedddb"/>
  <text x="802" y="251" fill="#65408a" font-size="19" font-weight="700" text-anchor="start">ROS nodes</text>
  <text x="802" y="275" fill="#435961" font-size="15" font-weight="400" text-anchor="start">DDS · CDR</text>
  <path d="M260 257 H326" fill="none" stroke="#255987" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
  <path d="M713 257 H780" fill="none" stroke="#65408a" stroke-width="2" stroke-linejoin="round" marker-end="url(#purple)" marker-start="url(#purple)"/>
  <rect x="32" y="326" width="976" height="85" rx="10" fill="#fff" stroke="#cedddb"/>
  <text x="48" y="355" fill="#12644e" font-size="17" font-weight="700" text-anchor="start">Route direction</text>
  <text x="48" y="380" fill="#435961" font-size="15" font-weight="400" text-anchor="start">The arrow applies to topic data, service requests or action goals.</text>
  <text x="48" y="401" fill="#435961" font-size="15" font-weight="400" text-anchor="start">Service responses and action feedback and results flow back to the caller.</text>
</svg>
