<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="502" viewBox="0 0 1040 502" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">From Node configuration to callbacks</title>
  <desc id="desc">Choose a Node connection. Inproc uses a shared ZeroMQ Context, native TCP and IPC can use HTTP discovery, and WebSocket connects to /ws-rpc. Nodes own communication entities, timers and local parameters. spin or start runs callbacks.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    </style>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#12644e"/>
    </marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#255987"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1038" height="500" rx="18" fill="#f5f9f8" stroke="#cedddb"/>
  <text x="32" y="53" fill="#172d33" font-size="28" font-weight="700" text-anchor="start">From Node configuration to callbacks</text>
  <rect x="32" y="76" width="304" height="72" rx="10" fill="#edf5fb" stroke="#cedddb"/>
  <text x="184.0" y="105" fill="#255987" font-size="19" font-weight="700" text-anchor="middle">Shared Context</text>
  <text x="184.0" y="129" fill="#435961" font-size="15" font-weight="400" text-anchor="middle">inproc · same process</text>
  <rect x="368" y="76" width="304" height="72" rx="10" fill="#edf5fb" stroke="#cedddb"/>
  <text x="520.0" y="105" fill="#255987" font-size="19" font-weight="700" text-anchor="middle">HTTP discovery</text>
  <text x="520.0" y="129" fill="#435961" font-size="15" font-weight="400" text-anchor="middle">Native tcp or ipc endpoints</text>
  <rect x="704" y="76" width="304" height="72" rx="10" fill="#edf5fb" stroke="#cedddb"/>
  <text x="856.0" y="105" fill="#255987" font-size="19" font-weight="700" text-anchor="middle">WebSocket</text>
  <text x="856.0" y="129" fill="#435961" font-size="15" font-weight="400" text-anchor="middle">Broker URL · /ws-rpc</text>
  <path d="M184 150 V174" fill="none" stroke="#255987" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)"/>
  <path d="M520 150 V174" fill="none" stroke="#255987" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)"/>
  <path d="M856 150 V174" fill="none" stroke="#255987" stroke-width="2" stroke-linejoin="round" marker-end="url(#blue)"/>
  <rect x="32" y="180" width="976" height="225" rx="12" fill="#fff" stroke="#a7c6ba"/>
  <text x="52" y="213" fill="#12644e" font-size="22" font-weight="700" text-anchor="start">Node</text>
  <text x="52" y="239" fill="#435961" font-size="16" font-weight="400" text-anchor="start">Register communication entities and local runtime resources.</text>
  <rect x="52" y="250" width="302" height="66" rx="10" fill="#eaf5ef" stroke="#cedddb"/>
  <text x="68" y="279" fill="#12644e" font-size="19" font-weight="700" text-anchor="start">Topics</text>
  <text x="68" y="303" fill="#435961" font-size="15" font-weight="400" text-anchor="start">Publishers and subscriptions</text>
  <rect x="369" y="250" width="302" height="66" rx="10" fill="#eaf5ef" stroke="#cedddb"/>
  <text x="385" y="279" fill="#12644e" font-size="19" font-weight="700" text-anchor="start">Services</text>
  <text x="385" y="303" fill="#435961" font-size="15" font-weight="400" text-anchor="start">Clients and servers</text>
  <rect x="686" y="250" width="302" height="66" rx="10" fill="#eaf5ef" stroke="#cedddb"/>
  <text x="702" y="279" fill="#12644e" font-size="19" font-weight="700" text-anchor="start">Actions</text>
  <text x="702" y="303" fill="#435961" font-size="15" font-weight="400" text-anchor="start">Clients and servers</text>
  <rect x="52" y="323" width="302" height="66" rx="10" fill="#eaf5ef" stroke="#cedddb"/>
  <text x="68" y="352" fill="#12644e" font-size="19" font-weight="700" text-anchor="start">Timers</text>
  <text x="68" y="376" fill="#435961" font-size="15" font-weight="400" text-anchor="start">Periodic callbacks</text>
  <rect x="369" y="323" width="302" height="66" rx="10" fill="#eaf5ef" stroke="#cedddb"/>
  <text x="385" y="352" fill="#12644e" font-size="19" font-weight="700" text-anchor="start">Parameters</text>
  <text x="385" y="376" fill="#435961" font-size="15" font-weight="400" text-anchor="start">Local configuration</text>
  <rect x="686" y="323" width="302" height="66" rx="10" fill="#eaf5ef" stroke="#cedddb"/>
  <text x="702" y="352" fill="#12644e" font-size="19" font-weight="700" text-anchor="start">Callback groups</text>
  <text x="702" y="376" fill="#435961" font-size="15" font-weight="400" text-anchor="start">Control callback concurrency</text>
  <path d="M520 406 V431" fill="none" stroke="#12644e" stroke-width="2" stroke-linejoin="round" marker-end="url(#green)"/>
  <rect x="306" y="437" width="428" height="43" rx="10" fill="#eaf5ef" stroke="#b6cec4"/>
  <text x="520" y="465" fill="#12644e" font-size="18" font-weight="700" text-anchor="middle">spin() / start() drives callbacks</text>
</svg>
