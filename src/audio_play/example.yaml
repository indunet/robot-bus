# Example parameters for rbus_audio_play.
# rbus_audio_play --print-example-config > play.yaml

ros__parameters:
  input_topic: /audio/play
  # Empty = system default output device.
  device: ""
  sample_rate: 16000
  channels: 1
  # Max buffered PCM duration before oldest samples are dropped.
  max_buffer_ms: 500
