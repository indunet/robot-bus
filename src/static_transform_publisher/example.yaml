# Example parameters for rbus_static_transform_publisher.
# rbus_static_transform_publisher --print-example-config > static_tf.yaml

ros__parameters:
  output_topic: /tf_static
  # 0 = publish once then hang (late subscribers may miss); prefer a low rate.
  publish_rate_hz: 1.0
  transforms:
    - parent_frame_id: base_link
      child_frame_id: camera
      translation: { x: 0.1, y: 0.0, z: 0.2 }
      rotation_rpy: { roll: 0.0, pitch: 0.0, yaw: 0.0 }
    # Alternative orientation:
    # - parent_frame_id: base_link
    #   child_frame_id: imu_link
    #   translation: { x: 0.0, y: 0.0, z: 0.05 }
    #   rotation_xyzw: { x: 0.0, y: 0.0, z: 0.0, w: 1.0 }
