# Example parameters for rbus_xbox_joy.
# rbus_xbox_joy --print-example-config > xbox.yaml

ros__parameters:
  output_topic: /xbox_joy
  rumble_topic: /xbox_joy/rumble
  # Empty = first connected pad. Otherwise a numeric index ("0") or name substring.
  device: ""
  rate_hz: 50
  frame_id: xbox_joy
  # Stick deadzone in |axis| units (0.0 .. 1.0).
  deadzone: 0.1
