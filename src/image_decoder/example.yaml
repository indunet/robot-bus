# Example parameters for rbus_image_decoder.
# rbus_image_decoder --print-example-config > decoder.yaml
# rbus_image_decoder --params decoder.yaml

ros__parameters:
  input_topic: /camera/video
  output_topic: /camera/image_decoded
  # Default codec when CompressedVideo.format is empty; message format wins when set.
  codec: h264
  # Leave empty to auto-pick the first decoder that actually opens
  # (cuvid → videotoolbox → soft h264/hevc). Listed-but-unusable HW
  # decoders (e.g. cuvid without NVIDIA) are skipped.
  decoder: ""
  # Output Image encoding: rgb8 or bgr8.
  output_encoding: rgb8
