[package]
name = "ros-env"
version = "0.2.0"
edition = "2021"
authors = ["Sam Privett <sam@privett.dev>"]
license = "Apache-2.0"
description = "Patched ros-env: overlay re-export plus field-complete use_ros_shim stubs for rclrs 0.8"
rust-version = "1.85"
publish = false

[dependencies]
rosidl_runtime_rs = "0.6"
serde = { version = "1", optional = true, features = ["derive"] }
serde-big-array = { version = "0.5.1", optional = true }

[build-dependencies]
cargo_toml = "0.22"
ament_rs = "0.3"

[features]
serde = ["dep:serde", "dep:serde-big-array", "rosidl_runtime_rs/serde"]
use_ros_shim = ["rosidl_runtime_rs/use_ros_shim"]
