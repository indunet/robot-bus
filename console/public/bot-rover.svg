<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Top-down tracked bot (tank-like); +X (barrel) points right. Transparent background. -->
  <g transform="translate(64 64)">
    <ellipse cx="1" cy="2" rx="34" ry="22" fill="#000" opacity="0.28"/>
    <!-- tracks: warmer rubber so they read on dark map; tucked close to chassis -->
    <rect x="-22" y="-37" width="44" height="14" rx="4" fill="#5a4634" stroke="#d4a574" stroke-width="1.75"/>
    <rect x="-16" y="-34" width="8" height="8" rx="1.5" fill="#c4a06a"/>
    <rect x="-4" y="-34" width="8" height="8" rx="1.5" fill="#c4a06a"/>
    <rect x="8" y="-34" width="8" height="8" rx="1.5" fill="#c4a06a"/>
    <rect x="-22" y="23" width="44" height="14" rx="4" fill="#5a4634" stroke="#d4a574" stroke-width="1.75"/>
    <rect x="-16" y="26" width="8" height="8" rx="1.5" fill="#c4a06a"/>
    <rect x="-4" y="26" width="8" height="8" rx="1.5" fill="#c4a06a"/>
    <rect x="8" y="26" width="8" height="8" rx="1.5" fill="#c4a06a"/>
    <!-- chassis -->
    <rect x="-28" y="-22" width="52" height="44" rx="8" fill="#00b7d8" stroke="#9af0ff" stroke-width="2"/>
    <rect x="-20" y="-14" width="36" height="28" rx="5" fill="#0d3a44" opacity="0.55"/>
    <!-- sensor dome -->
    <circle cx="-2" cy="0" r="11" fill="#d8faff" stroke="#9af0ff" stroke-width="1.5"/>
    <circle cx="-2" cy="0" r="5" fill="#00b7d8" opacity="0.7"/>
    <!-- tank barrel (heading) -->
    <rect x="18" y="-7" width="10" height="14" rx="2" fill="#c9892a" stroke="#fbbf24" stroke-width="1"/>
    <rect x="26" y="-4" width="18" height="8" rx="2" fill="#f59e0b" stroke="#fbbf24" stroke-width="1"/>
    <rect x="42" y="-5.5" width="6" height="11" rx="1.5" fill="#d97706" stroke="#fbbf24" stroke-width="1"/>
  </g>
</svg>
