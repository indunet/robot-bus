[package]
name = "robot-bus-perf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "robot-bus performance harness"

[[bin]]
name = "robot_bus_perf"
path = "main.rs"

[features]
default = ["ws", "console-api"]
ws = ["robot-bus/ws"]
console-api = ["robot-bus/console-api"]

[dependencies]
robot-bus = { path = "../../crates/robot-bus", default-features = false, features = ["broker"] }
serde_json = "1"
