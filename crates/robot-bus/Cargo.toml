[package]
name = "robot-bus"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "ZeroMQ message bus: participant SDK, broker, WebSocket server, and embedded console"
readme = "README.md"
autobenches = false
autotests = false
# `assets/**` is the embedded console UI (generated by `just console`, gitignored).
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/build.rs",
    "/src/**",
    "/assets/**",
]

[lib]
name = "robot_bus"
crate-type = ["rlib"]

[features]
# One install gives the SDK and the broker. Client-only programs can opt out with
# `default-features = false`.
default = ["full"]
full = ["broker", "ws", "console", "demo-tank"]
# Broker routing, federation, `RobotBusBroker`, and the `robot_bus_broker` / `rbus` binaries.
broker = ["dep:clap", "dep:tempfile"]
# Optional in-process tank demo. Independent of the communication SDK.
demo-tank = ["broker"]
# WebSocket RPC: the client runtime in `Node` and the multiplexed server started by
# `RobotBusBroker`. axum shares one listener with the console when both are enabled.
ws = [
    "broker",
    "axum/ws",
    "dep:axum",
    "dep:futures-util",
    "dep:http",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tokio-tungstenite",
    "dep:tower-http",
]
# Embedded Web console (static UI + REST shim; same port as the WebSocket server when both are enabled).
console = ["console-api", "dep:rust-embed", "dep:mime_guess"]
# Monitoring/control-plane API without embedded web assets or a Node.js build.
console-api = [
    "broker",
    "dep:axum",
    "dep:http",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tower-http",
]

[dependencies]
robot-bus-msgs = { path = "../robot-bus-msgs", version = "3.3.0" }
anyhow = "1"
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio", "query", "json"] }
clap = { version = "4", optional = true, features = ["derive"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["sink"] }
http = { version = "1", optional = true }
libc = "0.2"
log = "0.4"
mime_guess = { version = "2", optional = true }
prost = "0.14"
rust-embed = { version = "8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
socket2 = { version = "0.6.5", features = ["all"] }
tempfile = { version = "3", optional = true }
thiserror = "2"
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
tokio-stream = { version = "0.1", optional = true, features = ["sync", "net"] }
tokio-tungstenite = { version = "0.29", optional = true }
tower-http = { version = "0.6", optional = true, features = ["cors"] }
ureq = { version = "2", default-features = false, features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
# This source package bundles libzmq 4.3.5.
zeromq-src = "=0.3.6"

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-stream = "0.1"
tokio-tungstenite = "0.29"

[[bin]]
name = "robot_bus_broker"
path = "src/bin/robot_bus_broker.rs"
required-features = ["broker"]

[[bin]]
name = "rbus"
path = "src/bin/rbus.rs"
required-features = ["broker"]

[[test]]
name = "bus"
path = "tests/bus/main.rs"
required-features = ["broker"]

[[test]]
name = "federation"
path = "tests/federation/main.rs"
required-features = ["broker"]

[[test]]
name = "node"
path = "tests/node/main.rs"
required-features = ["broker"]

[[test]]
name = "ws"
path = "tests/ws/main.rs"
required-features = ["broker"]

[[test]]
name = "console"
path = "tests/console/main.rs"
required-features = ["console-api"]

[[test]]
name = "ws_reliability"
path = "tests/ws_reliability.rs"
required-features = ["ws", "console-api"]

[[example]]
name = "robot_bus_interop"
path = "../../tests/interop/rust_peer.rs"

[[example]]
name = "topic_imu_listener"
path = "../../examples/topic_imu/rust/listener.rs"

[[example]]
name = "topic_imu_talker"
path = "../../examples/topic_imu/rust/talker.rs"

[[example]]
name = "service_set_bool_server"
path = "../../examples/service_set_bool/rust/server.rs"

[[example]]
name = "service_set_bool_client"
path = "../../examples/service_set_bool/rust/client.rs"

[[example]]
name = "action_fibonacci_server"
path = "../../examples/action_fibonacci/rust/server.rs"

[[example]]
name = "action_fibonacci_client"
path = "../../examples/action_fibonacci/rust/client.rs"

[package.metadata.docs.rs]
features = ["ws", "console"]
