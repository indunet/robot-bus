syntax = "proto3";

package control_msgs.action.v1;

import "std_msgs/msg/v1/header.proto";
import "builtin_interfaces/msg/v1/duration.proto";
import "trajectory_msgs/msg/v1/joint_trajectory.proto";
import "trajectory_msgs/msg/v1/multi_dof_joint_trajectory.proto";
import "control_msgs/msg/v1/joint_tolerance.proto";
import "control_msgs/msg/v1/joint_component_tolerance.proto";

// Equivalent to ROS 2 `control_msgs/action/FollowJointTrajectory`.
message FollowJointTrajectoryGoal {
  trajectory_msgs.msg.v1.JointTrajectory trajectory = 1;
  trajectory_msgs.msg.v1.MultiDOFJointTrajectory multi_dof_trajectory = 2;

  repeated control_msgs.msg.v1.JointTolerance path_tolerance = 3;
  repeated control_msgs.msg.v1.JointComponentTolerance component_path_tolerance = 4;

  repeated control_msgs.msg.v1.JointTolerance goal_tolerance = 5;
  repeated control_msgs.msg.v1.JointComponentTolerance component_goal_tolerance = 6;
  builtin_interfaces.msg.v1.Duration goal_time_tolerance = 7;
}

message FollowJointTrajectoryResult {
  // int32 in ROS 2:
  //   SUCCESSFUL = 0
  //   INVALID_GOAL = -1
  //   INVALID_JOINTS = -2
  //   OLD_HEADER_TIMESTAMP = -3
  //   PATH_TOLERANCE_VIOLATED = -4
  //   GOAL_TOLERANCE_VIOLATED = -5
  int32 error_code = 1;
  string error_string = 2;
}

message FollowJointTrajectoryFeedback {
  std_msgs.msg.v1.Header header = 1;
  repeated string joint_names = 2;
  trajectory_msgs.msg.v1.JointTrajectoryPoint desired = 3;
  trajectory_msgs.msg.v1.JointTrajectoryPoint actual = 4;
  trajectory_msgs.msg.v1.JointTrajectoryPoint error = 5;

  repeated string multi_dof_joint_names = 6;
  trajectory_msgs.msg.v1.MultiDOFJointTrajectoryPoint multi_dof_desired = 7;
  trajectory_msgs.msg.v1.MultiDOFJointTrajectoryPoint multi_dof_actual = 8;
  trajectory_msgs.msg.v1.MultiDOFJointTrajectoryPoint multi_dof_error = 9;
}
