syntax = "proto3";

package control_msgs.v1;

import "std_msgs/v1/header.proto";
import "trajectory_msgs/v1/joint_trajectory.proto";
import "trajectory_msgs/v1/multi_dof_joint_trajectory.proto";

// Equivalent to ROS 2 `control_msgs/msg/JointTrajectoryControllerState`.
message JointTrajectoryControllerState {
  std_msgs.v1.Header header = 1;
  repeated string joint_names = 2;

  trajectory_msgs.v1.JointTrajectoryPoint reference = 3;
  trajectory_msgs.v1.JointTrajectoryPoint feedback = 4;
  trajectory_msgs.v1.JointTrajectoryPoint error = 5;
  trajectory_msgs.v1.JointTrajectoryPoint output = 6;

  repeated string multi_dof_joint_names = 7;
  trajectory_msgs.v1.MultiDOFJointTrajectoryPoint multi_dof_reference = 8;
  trajectory_msgs.v1.MultiDOFJointTrajectoryPoint multi_dof_feedback = 9;
  trajectory_msgs.v1.MultiDOFJointTrajectoryPoint multi_dof_error = 10;
  trajectory_msgs.v1.MultiDOFJointTrajectoryPoint multi_dof_output = 11;
}
