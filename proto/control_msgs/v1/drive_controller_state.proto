syntax = "proto3";

package control_msgs.v1;

import "std_msgs/v1/header.proto";
import "geometry_msgs/v1/twist.proto";

// Equivalent to ROS 2 `control_msgs/msg/MecanumDriveControllerState`.
message MecanumDriveControllerState {
  std_msgs.v1.Header header = 1;
  double front_left_wheel_velocity = 2;
  double front_right_wheel_velocity = 3;
  double back_left_wheel_velocity = 4;
  double back_right_wheel_velocity = 5;
  geometry_msgs.v1.Twist reference_velocity = 6;
}

// Equivalent to ROS 2 `control_msgs/msg/SteeringControllerStatus`.
message SteeringControllerStatus {
  std_msgs.v1.Header header = 1;
  repeated double traction_wheels_position = 2;
  repeated double traction_wheels_velocity = 3;
  repeated double steer_positions = 4;
  repeated double linear_velocity_command = 5;
  repeated double steering_angle_command = 6;
}
