syntax = "proto3";

// gRPC gateway API for the action bus. Opaque goal/feedback/result bytes;
// wire kinds mirror ZMQ ActionKind (GOAL / FEEDBACK / RESULT / CANCEL).
package robot_bus_interface.grpc.v1;

enum ActionKind {
  ACTION_KIND_UNSPECIFIED = 0;
  ACTION_KIND_GOAL = 1;
  ACTION_KIND_FEEDBACK = 2;
  ACTION_KIND_RESULT = 3;
  ACTION_KIND_CANCEL = 4;
}

service ActionGateway {
  // One GOAL request followed by a finite
  // FEEDBACK… / RESULT response stream.
  rpc SendGoal(GoalCommand) returns (stream ActionEvent);
}

message GoalCommand {
  string action_name = 1;
  bytes goal = 2;
  // Optional; empty → gateway generates a UUID.
  string goal_id = 3;
  // Applied while this goal is active; 0 means wait forever.
  uint32 timeout_ms = 4;
}

message ActionEvent {
  string action_name = 1;
  string goal_id = 2;
  ActionKind kind = 3;
  bytes body = 4;
}
