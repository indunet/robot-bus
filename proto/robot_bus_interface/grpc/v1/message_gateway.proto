syntax = "proto3";

// gRPC gateway API (service/rpc). Distinct from ROS-style msg/srv packages
// under proto/<ros_pkg>/{msg|srv}/v1/ (e.g. std_msgs.msg.v1), which are
// payload types only.
package robot_bus_interface.grpc.v1;

service MessageGateway {
  // Subscribe by ZMQ topic prefix; stream matching messages as opaque bytes.
  rpc Subscribe(SubscribeRequest) returns (stream TopicMessage);
  // Publish one message onto the message bus (fire-and-forget; ack = accepted by XSUB).
  rpc Publish(TopicMessage) returns (PublishResponse);
}

message SubscribeRequest {
  // ZMQ subscribe prefix. Empty string subscribes to all topics.
  string topic = 1;
}

message TopicMessage {
  string topic = 1;
  bytes payload = 2;
}

message PublishResponse {}
