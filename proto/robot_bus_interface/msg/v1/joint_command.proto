syntax = "proto3";

package robot_bus_interface.msg.v1;

import "std_msgs/msg/v1/header.proto";

// robot-bus custom message (not a ROS 2 type).
//
// Command setpoints for EtherCAT / CiA402 joints.
// Arrays must match `joint_names` length, or be empty to leave that channel unused.
//
// Modes are selected per-joint in the node YAML (`csp` / `csv` / `cst`):
//   - CSP uses `position` (rad)
//   - CSV uses `velocity` (rad/s)
//   - CST uses `effort` (Nm)
message JointCommand {
  std_msgs.msg.v1.Header header = 1;
  repeated string joint_names = 2;
  repeated double position = 3;
  repeated double velocity = 4;
  repeated double effort = 5;
}
