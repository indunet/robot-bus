syntax = "proto3";

package nav_msgs.v1;

import "nav_msgs/v1/occupancy_grid.proto";
import "geometry_msgs/v1/stamped.proto";

// Equivalent to ROS 2 `nav_msgs/srv/SetMap`.
message SetMapRequest {
  OccupancyGrid map = 1;
  geometry_msgs.v1.PoseWithCovarianceStamped initial_pose = 2;
}

message SetMapResponse {
  bool success = 1;
}
