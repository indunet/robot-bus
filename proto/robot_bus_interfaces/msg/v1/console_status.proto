syntax = "proto3";

// Broker console monitoring snapshots published on `/robot_bus/*` system topics.
package robot_bus_interfaces.msg.v1;

message BrokerStatus {
  string status = 1;
  string version = 2;
  uint64 uptime = 3;
  uint32 pid = 4;
  string grpc_addr = 5;
  string web_addr = 6;
  string msg_bus_x_sub = 7;
  string msg_bus_x_pub = 8;
  string svc_fe = 9;
  string svc_be = 10;
  string act_fe = 11;
  string act_be = 12;
  double msg_per_sec = 13;
  uint64 bytes_per_sec = 14;
  double svc_calls_per_sec = 15;
  double act_runs_per_sec = 16;
  uint64 total_messages = 17;
  uint64 total_errors = 18;
}

message TopicStats {
  string name = 1;
  optional string type_name = 2;
  double msg_per_sec = 3;
  uint64 bytes_per_sec = 4;
  uint64 last_seen = 5;
  uint64 total_msgs = 6;
  repeated double sparkline = 7;
  uint64 subscribers = 8;
  uint64 publishers = 9;
}

message TopicStatsList {
  repeated TopicStats topics = 1;
}

message ServiceStats {
  string name = 1;
  uint64 calls = 2;
  double calls_per_sec = 3;
  uint64 errors = 4;
  uint64 timeouts = 5;
  uint64 avg_latency_ms = 6;
  uint64 last_call_at = 7;
  uint64 workers = 8;
}

message ServiceStatsList {
  repeated ServiceStats services = 1;
}

message ActionStats {
  string name = 1;
  uint64 runs = 2;
  double runs_per_sec = 3;
  uint64 active = 4;
  uint64 errors = 5;
  uint64 avg_duration_ms = 6;
  uint64 last_run_at = 7;
}

message ActionStatsList {
  repeated ActionStats actions = 1;
}

message TopologyNode {
  string id = 1;
  string kind = 2;
  string label = 3;
  optional string type_name = 4;
  optional double msg_per_sec = 5;
}

message TopologyEdge {
  string id = 1;
  string source = 2;
  string target = 3;
  string kind = 4;
  string topic = 5;
}

message TopologySnapshot {
  repeated TopologyNode nodes = 1;
  repeated TopologyEdge edges = 2;
}

message ConsoleEvent {
  string id = 1;
  uint64 ts = 2;
  string level = 3;
  string source = 4;
  string message = 5;
}

// Control-plane registration (clients → broker).
message TopologyRegister {
  string endpoint_id = 1;
  string node_name = 2;
  // "publisher" | "subscriber" | "service_client" | "service_server"
  // | "action_client" | "action_server"
  string kind = 3;
  // Topic, service, or action name.
  string topic = 4;
}

message TopologyUnregister {
  string endpoint_id = 1;
}

message TopicTypeRegister {
  string topic = 1;
  string type_name = 2;
}

// Immediate subscriber-count event for lazy ROS2→bus topic routes.
// `subscribers` is the live topology count of kind=subscriber on `topic`.
message TopicDemand {
  string topic = 1;
  uint32 subscribers = 2;
}

// One ROS2 ↔ bus route. Published by the bridge process (not the broker).
message BridgeRoute {
  // "topic" | "service" | "action"
  string kind = 1;
  // "ros→bus" | "bus→ros"
  string direction = 2;
  string ros_name = 3;
  string bus_name = 4;
  string type_name = 5;
  string ros_qos = 6;
  string bus_qos = 7;
  bool lazy = 8;
  bool enabled = 9;
  uint64 rx = 10;
  uint64 tx = 11;
  uint64 convert_fail = 12;
  uint64 decode_fail = 13;
  uint64 publish_fail = 14;
  uint64 last_rx_ms = 15;
  bool idle = 16;
}

// One Ros2Bridge process. Console merges by `bridge_id` (multi-bridge).
message BridgeSnapshot {
  string bridge_id = 1;
  string bridge_name = 2;
  repeated BridgeRoute routes = 3;
}
