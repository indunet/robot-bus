syntax = "proto3";

package robot_bus_interfaces.action.v1;

import "geometry_msgs/msg/v1/pose2d.proto";

// 多途经点导航 — visit planar poses in order.
message MultiWaypointNavigationGoal {
  repeated geometry_msgs.msg.v1.Pose2D poses = 1;
}

message MultiWaypointNavigationFeedback {
  geometry_msgs.msg.v1.Pose2D current_pose = 1;
  // Normalized overall path progress in [0, 1].
  float progress = 2;
}

message MultiWaypointNavigationResult {
  bool success = 1;
  // Human-readable detail; typically set on failure.
  string msg = 2;
}
