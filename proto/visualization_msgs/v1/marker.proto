syntax = "proto3";

package visualization_msgs.v1;

import "std_msgs/v1/header.proto";
import "std_msgs/v1/color_rgba.proto";
import "builtin_interfaces/v1/duration.proto";
import "geometry_msgs/v1/pose.proto";
import "geometry_msgs/v1/vector3.proto";
import "geometry_msgs/v1/point.proto";
import "sensor_msgs/v1/compressed_image.proto";
import "visualization_msgs/v1/uv_coordinate.proto";
import "visualization_msgs/v1/mesh_file.proto";

// Equivalent to ROS 2 `visualization_msgs/msg/Marker`.
//
// Type constants (int32 in ROS 2):
//   ARROW=0, CUBE=1, SPHERE=2, CYLINDER=3, LINE_STRIP=4, LINE_LIST=5,
//   CUBE_LIST=6, SPHERE_LIST=7, POINTS=8, TEXT_VIEW_FACING=9,
//   MESH_RESOURCE=10, TRIANGLE_LIST=11
// Action constants:
//   ADD=0, MODIFY=0, DELETE=2, DELETEALL=3
message Marker {
  std_msgs.v1.Header header = 1;
  string ns = 2;
  int32 id = 3;
  int32 type = 4;
  int32 action = 5;
  geometry_msgs.v1.Pose pose = 6;
  geometry_msgs.v1.Vector3 scale = 7;
  std_msgs.v1.ColorRGBA color = 8;
  builtin_interfaces.v1.Duration lifetime = 9;
  bool frame_locked = 10;

  repeated geometry_msgs.v1.Point points = 11;
  repeated std_msgs.v1.ColorRGBA colors = 12;

  string texture_resource = 13;
  sensor_msgs.v1.CompressedImage texture = 14;
  repeated UVCoordinate uv_coordinates = 15;

  string text = 16;

  string mesh_resource = 17;
  MeshFile mesh_file = 18;
  bool mesh_use_embedded_materials = 19;
}

// Equivalent to ROS 2 `visualization_msgs/msg/MarkerArray`.
message MarkerArray {
  repeated Marker markers = 1;
}
