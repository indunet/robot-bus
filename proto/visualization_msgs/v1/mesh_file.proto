syntax = "proto3";

package visualization_msgs.v1;

// Equivalent to ROS 2 `visualization_msgs/msg/MeshFile`.
// Used when embedding a mesh file inside a Marker.
message MeshFile {
  // The filename is used for both debug purposes and to provide a file
  // extension for the binary mesh data.
  string filename = 1;

  // The mesh data storage binary format is described by the file
  // extension given in the filename.
  bytes data = 2;
}
