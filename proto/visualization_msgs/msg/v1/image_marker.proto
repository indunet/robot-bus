syntax = "proto3";

package visualization_msgs.msg.v1;

import "std_msgs/msg/v1/header.proto";
import "std_msgs/msg/v1/color_rgba.proto";
import "builtin_interfaces/msg/v1/duration.proto";
import "geometry_msgs/msg/v1/point.proto";

// Equivalent to ROS 2 `visualization_msgs/msg/ImageMarker`.
//
// Type: CIRCLE=0, LINE_STRIP=1, LINE_LIST=2, POLYGON=3, POINTS=4
// Action: ADD=0, REMOVE=1
message ImageMarker {
  std_msgs.msg.v1.Header header = 1;
  string ns = 2;
  int32 id = 3;
  int32 type = 4;
  int32 action = 5;
  geometry_msgs.msg.v1.Point position = 6;
  float scale = 7;
  std_msgs.msg.v1.ColorRGBA outline_color = 8;
  uint32 filled = 9;
  std_msgs.msg.v1.ColorRGBA fill_color = 10;
  builtin_interfaces.msg.v1.Duration lifetime = 11;
  repeated geometry_msgs.msg.v1.Point points = 12;
  repeated std_msgs.msg.v1.ColorRGBA outline_colors = 13;
}
