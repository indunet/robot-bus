syntax = "proto3";

package nav2_msgs.msg.v1;

// Equivalent to ROS 2 `nav2_msgs/msg/CollisionMonitorState`.
message CollisionMonitorState {
  // uint8 in ROS 2:
  //   DO_NOTHING = 0
  //   STOP = 1
  //   SLOWDOWN = 2
  //   APPROACH = 3
  //   LIMIT = 4
  uint32 action_type = 1;

  string polygon_name = 2;
}
