syntax = "proto3";

package nav2_msgs.action.v1;

import "builtin_interfaces/msg/v1/duration.proto";

// Equivalent to ROS 2 `nav2_msgs/action/Wait`.
message WaitGoal {
  builtin_interfaces.msg.v1.Duration time = 1;
}

message WaitResult {
  builtin_interfaces.msg.v1.Duration total_elapsed_time = 1;
  // uint16 in ROS 2.
  uint32 error_code = 2;
  string error_msg = 3;
}

message WaitFeedback {
  builtin_interfaces.msg.v1.Duration time_left = 1;
}
