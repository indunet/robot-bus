syntax = "proto3";

package nav2_msgs.v1;

import "std_msgs/v1/header.proto";

// Equivalent to ROS 2 `nav2_msgs/msg/SpeedLimit`.
message SpeedLimit {
  std_msgs.v1.Header header = 1;

  // True: percentage of maximum speed; false: absolute limit in m/s.
  bool percentage = 2;

  double speed_limit = 3;
}
