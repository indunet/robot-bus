// Adapted from Foxglove schemas (https://github.com/foxglove/foxglove-sdk).
// Official package is `foxglove`; here remapped to project layout.

syntax = "proto3";

import "foxglove_msgs/msg/v1/quaternion.proto";
import "foxglove_msgs/msg/v1/vector3.proto";

package foxglove_msgs.msg.v1;

// A position and orientation for an object or reference frame in 3D space
message Pose {
  // Point denoting position in 3D space
  foxglove_msgs.msg.v1.Vector3 position = 1;

  // Quaternion denoting orientation in 3D space
  foxglove_msgs.msg.v1.Quaternion orientation = 2;
}
