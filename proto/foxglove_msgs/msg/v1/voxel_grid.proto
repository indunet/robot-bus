// Adapted from Foxglove schemas (https://github.com/foxglove/foxglove-sdk).
// Official package is `foxglove`; here remapped to project layout.

syntax = "proto3";

import "foxglove_msgs/msg/v1/packed_element_field.proto";
import "foxglove_msgs/msg/v1/pose.proto";
import "foxglove_msgs/msg/v1/vector3.proto";
import "google/protobuf/timestamp.proto";

package foxglove_msgs.msg.v1;

// A 3D grid of data
message VoxelGrid {
  // Timestamp of grid
  google.protobuf.Timestamp timestamp = 1;

  // Frame of reference
  string frame_id = 2;

  // Origin of the grid’s lower-front-left corner in the reference frame. The grid’s pose is defined relative to this corner, so an untransformed grid with an identity orientation has this corner at the origin.
  foxglove_msgs.msg.v1.Pose pose = 3;

  // Number of grid rows
  fixed32 row_count = 4;

  // Number of grid columns
  fixed32 column_count = 5;

  // Size of single grid cell along x, y, and z axes, relative to `pose`
  foxglove_msgs.msg.v1.Vector3 cell_size = 6;

  // Number of bytes between depth slices in `data`
  fixed32 slice_stride = 7;

  // Number of bytes between rows in `data`
  fixed32 row_stride = 8;

  // Number of bytes between cells within a row in `data`
  fixed32 cell_stride = 9;

  // Fields in `data`. `red`, `green`, `blue`, and `alpha` are optional for customizing the grid's color.
  repeated foxglove_msgs.msg.v1.PackedElementField fields = 10;

  // Grid cell data, interpreted using `fields`, in depth-major, row-major (Z-Y-X) order.
  // For the data element starting at byte offset i, the coordinates of its corner closest to the origin will be:
  // 
  // - z = i / slice_stride * cell_size.z
  // - y = (i % slice_stride) / row_stride * cell_size.y
  // - x = (i % row_stride) / cell_stride * cell_size.x
  bytes data = 11;
}
