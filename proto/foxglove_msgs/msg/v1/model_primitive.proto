// Adapted from Foxglove schemas (https://github.com/foxglove/foxglove-sdk).
// Official package is `foxglove`; here remapped to project layout.

syntax = "proto3";

import "foxglove_msgs/msg/v1/color.proto";
import "foxglove_msgs/msg/v1/pose.proto";
import "foxglove_msgs/msg/v1/vector3.proto";

package foxglove_msgs.msg.v1;

// A primitive representing a 3D model file loaded from an external URL or embedded data
message ModelPrimitive {
  // Origin of model relative to reference frame
  foxglove_msgs.msg.v1.Pose pose = 1;

  // Scale factor to apply to the model along each axis
  foxglove_msgs.msg.v1.Vector3 scale = 2;

  // Solid color to use for the whole model if `override_color` is true.
  foxglove_msgs.msg.v1.Color color = 3;

  // Whether to use the color specified in `color` instead of any materials embedded in the original model.
  bool override_color = 4;

  // URL pointing to model file. One of `url` or `data` should be non-empty.
  string url = 5;

  // [Media type](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/MIME_types) of embedded model (e.g. `model/gltf-binary`). Required if `data` is provided instead of `url`. Overrides the inferred media type if `url` is provided.
  string media_type = 6;

  // Embedded model. One of `url` or `data` should be non-empty. If `data` is non-empty, `media_type` must be set to indicate the type of the data.
  bytes data = 7;
}
