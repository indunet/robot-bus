// Adapted from Foxglove schemas (https://github.com/foxglove/foxglove-sdk).
// Official package is `foxglove`; here remapped to project layout.

syntax = "proto3";

import "foxglove_msgs/msg/v1/color.proto";
import "foxglove_msgs/msg/v1/pose.proto";

package foxglove_msgs.msg.v1;

// A primitive representing a text label
message TextPrimitive {
  // Position of the center of the text box and orientation of the text. Identity orientation means the text is oriented in the xy-plane and flows from -x to +x.
  foxglove_msgs.msg.v1.Pose pose = 1;

  // Whether the text should respect `pose.orientation` (false) or always face the camera (true)
  bool billboard = 2;

  // Font size (height of one line of text)
  double font_size = 3;

  // Indicates whether `font_size` is a fixed size in screen pixels (true), or specified in world coordinates and scales with distance from the camera (false)
  bool scale_invariant = 4;

  // Color of the text
  foxglove_msgs.msg.v1.Color color = 5;

  // Text
  string text = 6;
}
