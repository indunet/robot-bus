// Adapted from Foxglove schemas (https://github.com/foxglove/foxglove-sdk).
// Official package is `foxglove`; here remapped to project layout.

syntax = "proto3";

import "foxglove_msgs/msg/v1/frame_transform.proto";

package foxglove_msgs.msg.v1;

// An array of FrameTransform messages
message FrameTransforms {
  // Array of transforms
  repeated foxglove_msgs.msg.v1.FrameTransform transforms = 1;
}
