// Adapted from Foxglove schemas (https://github.com/foxglove/foxglove-sdk).
// Official package is `foxglove`; here remapped to project layout.

syntax = "proto3";

package foxglove_msgs.msg.v1;

// A color in RGBA format
message Color {
  // Red value between 0 and 1
  double r = 1;

  // Green value between 0 and 1
  double g = 2;

  // Blue value between 0 and 1
  double b = 3;

  // Alpha value between 0 and 1
  double a = 4;
}
