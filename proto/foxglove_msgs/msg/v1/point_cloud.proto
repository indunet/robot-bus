// Adapted from Foxglove schemas (https://github.com/foxglove/foxglove-sdk).
// Official package is `foxglove`; here remapped to project layout.

syntax = "proto3";

import "foxglove_msgs/msg/v1/packed_element_field.proto";
import "foxglove_msgs/msg/v1/pose.proto";
import "google/protobuf/timestamp.proto";

package foxglove_msgs.msg.v1;

// A collection of N-dimensional points, which may contain additional fields with information like normals, intensity, etc.
message PointCloud {
  // Timestamp of point cloud
  google.protobuf.Timestamp timestamp = 1;

  // Frame of reference
  string frame_id = 2;

  // The origin of the point cloud relative to the frame of reference
  foxglove_msgs.msg.v1.Pose pose = 3;

  // Number of bytes between points in the `data`
  fixed32 point_stride = 4;

  // Fields in `data`. At least 2 coordinate fields from `x`, `y`, and `z` are required for each point's position; `red`, `green`, `blue`, and `alpha` are optional for customizing each point's color.
  repeated foxglove_msgs.msg.v1.PackedElementField fields = 5;

  // Point data, interpreted using `fields`
  bytes data = 6;
}
