// Adapted from Foxglove schemas (https://github.com/foxglove/foxglove-sdk).
// Official package is `foxglove`; here remapped to project layout.

syntax = "proto3";

import "foxglove_msgs/msg/v1/joint_state.proto";
import "google/protobuf/timestamp.proto";

package foxglove_msgs.msg.v1;

// The state of a set of joints at a given time.
message JointStates {
  // Timestamp of the joint states
  google.protobuf.Timestamp timestamp = 1;

  // Joint states
  repeated foxglove_msgs.msg.v1.JointState joints = 2;
}
