// Adapted from Foxglove schemas (https://github.com/foxglove/foxglove-sdk).
// Official package is `foxglove`; here remapped to project layout.

syntax = "proto3";

import "foxglove_msgs/msg/v1/color.proto";
import "foxglove_msgs/msg/v1/key_value_pair.proto";
import "foxglove_msgs/msg/v1/point2.proto";
import "google/protobuf/timestamp.proto";

package foxglove_msgs.msg.v1;

// An array of points on a 2D image
message PointsAnnotation {
  // Type of points annotation
  enum Type {
    // Unknown points annotation type
    UNKNOWN = 0;

    // Individual points: 0, 1, 2, ...
    POINTS = 1;

    // Closed polygon: 0-1, 1-2, ..., (n-1)-n, n-0
    LINE_LOOP = 2;

    // Connected line segments: 0-1, 1-2, ..., (n-1)-n
    LINE_STRIP = 3;

    // Individual line segments: 0-1, 2-3, 4-5, ...
    LINE_LIST = 4;
  }
  // Timestamp of annotation
  google.protobuf.Timestamp timestamp = 1;

  // Type of points annotation to draw
  Type type = 2;

  // Points in 2D image coordinates (pixels).
  // These coordinates use the top-left corner of the top-left pixel of the image as the origin.
  repeated foxglove_msgs.msg.v1.Point2 points = 3;

  // Outline color
  foxglove_msgs.msg.v1.Color outline_color = 4;

  // Per-point colors, if `type` is `POINTS`, or per-segment stroke colors, if `type` is `LINE_LIST`, `LINE_STRIP` or `LINE_LOOP`.
  repeated foxglove_msgs.msg.v1.Color outline_colors = 5;

  // Fill color
  foxglove_msgs.msg.v1.Color fill_color = 6;

  // Stroke thickness in pixels
  double thickness = 7;

  // Additional user-provided metadata associated with this annotation. Keys must be unique.
  repeated foxglove_msgs.msg.v1.KeyValuePair metadata = 8;
}
