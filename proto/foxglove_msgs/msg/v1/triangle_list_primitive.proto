// Adapted from Foxglove schemas (https://github.com/foxglove/foxglove-sdk).
// Official package is `foxglove`; here remapped to project layout.

syntax = "proto3";

import "foxglove_msgs/msg/v1/color.proto";
import "foxglove_msgs/msg/v1/point3.proto";
import "foxglove_msgs/msg/v1/pose.proto";

package foxglove_msgs.msg.v1;

// A primitive representing a set of triangles or a surface tiled by triangles
message TriangleListPrimitive {
  // Origin of triangles relative to reference frame
  foxglove_msgs.msg.v1.Pose pose = 1;

  // Vertices to use for triangles, interpreted as a list of triples (0-1-2, 3-4-5, ...)
  repeated foxglove_msgs.msg.v1.Point3 points = 2;

  // Solid color to use for the whole shape. Ignored if `colors` is non-empty.
  foxglove_msgs.msg.v1.Color color = 3;

  // Per-vertex colors (if specified, must have the same length as `points`).
  repeated foxglove_msgs.msg.v1.Color colors = 4;

  // Indices into the `points` and `colors` attribute arrays, which can be used to avoid duplicating attribute data.
  // 
  // If omitted or empty, indexing will not be used. This default behavior is equivalent to specifying [0, 1, ..., N-1] for the indices (where N is the number of `points` provided).
  repeated fixed32 indices = 5;
}
