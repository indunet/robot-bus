syntax = "proto3";

package map_msgs.msg.v1;

import "std_msgs/msg/v1/header.proto";

// Equivalent to ROS 2 `map_msgs/msg/OccupancyGridUpdate`.
message OccupancyGridUpdate {
  std_msgs.msg.v1.Header header = 1;
  int32 x = 2;
  int32 y = 3;
  uint32 width = 4;
  uint32 height = 5;
  // Patch cells in row-major order. ROS 2 `int8[]` as two's-complement bytes
  // (same layout as OccupancyGrid.data / CDR). 0xFF = unknown.
  bytes data = 6;
}
