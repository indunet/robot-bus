syntax = "proto3";

package tf2_msgs.msg.v1;

// Equivalent to ROS 2 `tf2_msgs/msg/TF2Error`.
message TF2Error {
  // uint8 in ROS 2:
  //   NO_ERROR = 0
  //   LOOKUP_ERROR = 1
  //   CONNECTIVITY_ERROR = 2
  //   EXTRAPOLATION_ERROR = 3
  //   INVALID_ARGUMENT_ERROR = 4
  //   TIMEOUT_ERROR = 5
  //   TRANSFORM_ERROR = 6
  uint32 error = 1;
  string error_string = 2;
}
