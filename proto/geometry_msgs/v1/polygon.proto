syntax = "proto3";

package geometry_msgs.v1;

import "std_msgs/v1/header.proto";
import "geometry_msgs/v1/point32.proto";

// Equivalent to ROS 2 `geometry_msgs/msg/Polygon`.
// A specification of a polygon where the first and last points are assumed to
// be connected.
message Polygon {
  repeated Point32 points = 1;
}

// Equivalent to ROS 2 `geometry_msgs/msg/PolygonStamped`.
message PolygonStamped {
  std_msgs.v1.Header header = 1;
  Polygon polygon = 2;
}
