syntax = "proto3";

package sensor_msgs.v1;

import "std_msgs/v1/header.proto";
import "geometry_msgs/v1/quaternion.proto";
import "geometry_msgs/v1/vector3.proto";

// Equivalent to ROS 2 `sensor_msgs/msg/Imu`.
//
// Accelerations are in m/s^2; angular velocity in rad/s.
// Covariance matrices are row-major 3x3 (9 elements). Element 0 set to -1 means
// the associated estimate is not available.
message Imu {
  std_msgs.v1.Header header = 1;

  geometry_msgs.v1.Quaternion orientation = 2;
  repeated double orientation_covariance = 3;

  geometry_msgs.v1.Vector3 angular_velocity = 4;
  repeated double angular_velocity_covariance = 5;

  geometry_msgs.v1.Vector3 linear_acceleration = 6;
  repeated double linear_acceleration_covariance = 7;
}
