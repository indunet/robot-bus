syntax = "proto3";

package sensor_msgs.v1;

import "std_msgs/v1/header.proto";

// Equivalent to ROS 2 `sensor_msgs/msg/LaserEcho`.
message LaserEcho {
  repeated float echoes = 1;
}

// Equivalent to ROS 2 `sensor_msgs/msg/MultiEchoLaserScan`.
message MultiEchoLaserScan {
  std_msgs.v1.Header header = 1;

  float angle_min = 2;
  float angle_max = 3;
  float angle_increment = 4;
  float time_increment = 5;
  float scan_time = 6;
  float range_min = 7;
  float range_max = 8;

  repeated LaserEcho ranges = 9;
  repeated LaserEcho intensities = 10;
}
