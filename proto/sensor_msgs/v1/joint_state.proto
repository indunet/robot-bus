syntax = "proto3";

package sensor_msgs.v1;

import "std_msgs/v1/header.proto";

// Equivalent to ROS 2 `sensor_msgs/msg/JointState`.
//
// All repeated fields should have the same size, or be empty.
message JointState {
  std_msgs.v1.Header header = 1;
  repeated string name = 2;
  repeated double position = 3;
  repeated double velocity = 4;
  repeated double effort = 5;
}
