syntax = "proto3";

package sensor_msgs.msg.v1;

import "std_msgs/msg/v1/header.proto";

// Equivalent to ROS 2 `sensor_msgs/msg/LaserScan`.
message LaserScan {
  std_msgs.msg.v1.Header header = 1;

  float angle_min = 2;
  float angle_max = 3;
  float angle_increment = 4;
  float time_increment = 5;
  float scan_time = 6;
  float range_min = 7;
  float range_max = 8;

  repeated float ranges = 9;
  repeated float intensities = 10;
}
