[package]
name = "robot-bus-image-encoder"
version = "0.1.2"
edition = "2024"
description = "robot-bus tool node: encode sensor_msgs/Image to foxglove CompressedVideo (H.264/H.265 via FFmpeg)"
license = "Apache-2.0"
publish = false

[[bin]]
name = "robot-bus-image-encoder"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
ffmpeg-next = "8"
log = "0.4"
prost-types = "0.14"
robot-bus = { path = "../..", default-features = false }
thiserror = "2"
