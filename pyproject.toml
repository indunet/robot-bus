[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "robot-bus"
version = "0.0.2"
description = "ZeroMQ message bus: broker routing and participant SDK"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "deng_ran", email = "deng_ran@aliyun.com" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
urls = { Repository = "https://github.com/indunet/robot-bus" }

[project.scripts]
robot-bus-broker = "robot_bus:run_broker"

[tool.maturin]
features = ["extension-module"]
module-name = "robot_bus"
