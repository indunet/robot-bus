[workspace]

[package]
name = "robot-bus-nodejs"
version = "0.1.2"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "2"
anyhow = "1"
prost = "0.14"
robot-bus = { path = "../../..", default-features = false, features = ["grpc", "console"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
