[workspace]

[package]
name = "robot-bus-cpp"
version = "0.1.7"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "robot_bus_c"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = []
# Links system ROS 2 (rcl via rclrs). Build only with a sourced Humble/Jazzy env.
ros2 = ["robot-bus/ros2"]
# Typecheck without a real ROS install.
ros2-shim = ["robot-bus/ros2-shim"]

[dependencies]
anyhow = "1"
prost = "0.14"
robot-bus = { path = "../../..", default-features = false, features = ["grpc", "console"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
