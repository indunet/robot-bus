[workspace]

[package]
name = "robot-bus-cpp"
version = "2.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "robot_bus_c"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = []
# Links system ROS 2 (rcl via rclrs). Build only with a sourced Humble/Jazzy env.
ros2 = ["robot-bus/ros2", "dep:rclrs"]
# Typecheck without a real ROS install (also enables local `ros2` so FFI is compiled).
ros2-shim = ["ros2", "robot-bus/ros2-shim", "rclrs/use_ros_shim"]

[dependencies]
anyhow = "1"
prost = "0.14"
robot-bus = { path = "../../..", default-features = false, features = ["ws", "console"] }
rclrs = { git = "https://github.com/ros2-rust/ros2_rust.git", rev = "4606ed41a212fb6c65ab01d1e79ddabde4e7cb05", optional = true }
uuid = { version = "1", features = ["v4"] }

[patch.crates-io]
ros-env = { path = "../../../third_party/ros-env-shim" }

[profile.release]
lto = true
