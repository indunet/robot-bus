[workspace]

[package]
name = "robot-bus-cpp"
version = "3.3.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
name = "robot_bus_c"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = []
# Links the Rust ROS 2 bridge. Build only with a sourced Humble/Jazzy env.
ros2 = ["dep:robot-bus-ros2"]

[dependencies]
anyhow = "1"
prost = "0.14"
robot-bus = { path = "../../../crates/robot-bus", default-features = false, features = ["ws", "console", "demo-tank"] }
robot-bus-ros2 = { path = "../../../crates/robot-bus-ros2", optional = true }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
