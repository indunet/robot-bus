[workspace]

[package]
name = "robot-bus-python"
version = "3.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "PyO3 bindings for the robot-bus Python SDK"

[lib]
name = "robot_bus_native"
crate-type = ["cdylib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]
ws = ["robot-bus/ws", "robot-bus-broker/ws"]
console = ["console-api", "robot-bus-broker/console"]
console-api = ["robot-bus-broker/console-api"]
demo-tank = ["robot-bus-broker/demo-tank"]

[dependencies]
pyo3 = { version = "0.25", features = ["abi3-py39"] }
anyhow = "1"
robot-bus = { path = "../../../crates/robot-bus", default-features = false }
robot-bus-broker = { path = "../../../crates/robot-bus-broker", default-features = false }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
