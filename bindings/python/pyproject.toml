[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "robot-bus"
version = "2.2.0"
description = "ZeroMQ message bus: broker routing and participant SDK"
readme = "../../README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "deng_ran", email = "deng_ran@aliyun.com" }]
dependencies = ["protobuf>=7.35,<8"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
urls = { Repository = "https://github.com/indunet/robot-bus" }

[tool.maturin]
manifest-path = "../../Cargo.toml"
python-source = "."
module-name = "robot_bus._native"
features = ["extension-module", "ws", "console"]
# Embed the Web console (same as C++ / TypeScript native). Keep other extras off.
# Note: `cargo-extra-args` was removed in maturin 0.13; use this flag instead.
no-default-features = true
