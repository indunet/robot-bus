[workspace]
members = [
    "crates/robot-bus-msgs",
    "crates/robot-bus",
    "crates/robot-bus-broker",
    "crates/robot-bus-ros2",
    "benches/robot_bus_perf",
    "benches/ros2_bridge_perf",
]
default-members = [
    "crates/robot-bus-msgs",
    "crates/robot-bus",
    "crates/robot-bus-broker",
]
# Invoked via --manifest-path; each declares its own [workspace].
exclude = [
    "scripts/gen_rust_msgs",
    "bindings/cpp/native",
    "bindings/typescript/native",
    "bindings/python/native",
]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["deng_ran <deng_ran@aliyun.com>"]
repository = "https://github.com/indunet/robot-bus"
