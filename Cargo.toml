[package]
name = "robot-bus"
version = "0.0.1"
edition = "2024"
description = "ZeroMQ message bus: broker routing and participant SDK"
license = "Apache-2.0"
authors = ["deng_ran <deng_ran@aliyun.com>"]
repository = "https://github.com/indunet/robot-bus"
readme = "README.md"

[lib]
name = "robot_bus"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enable with maturin / `cargo build --features extension-module` for the Python module.
extension-module = ["dep:pyo3", "pyo3/extension-module"]

[dependencies]
anyhow = "1"
log = "0.4"
prost = "0.13"
pyo3 = { version = "0.25", optional = true, features = ["abi3-py39"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zmq = "0.10"

[build-dependencies]
prost-build = "0.13"

[[bin]]
name = "message_bus_broker"
path = "src/bin/message_bus.rs"

[[bin]]
name = "service_bus_broker"
path = "src/bin/service_bus.rs"

[[bin]]
name = "action_bus_broker"
path = "src/bin/action_bus.rs"

[[bin]]
name = "robot_bus_broker"
path = "src/bin/robot_bus_broker.rs"
