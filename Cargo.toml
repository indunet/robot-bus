[workspace]
members = ["."]
# Invoked via --manifest-path; each declares its own [workspace].
exclude = [
    "tools/gen-msgs",
    "bindings/cpp/native",
    "bindings/typescript/native",
]
default-members = ["."]
resolver = "2"

[package]
name = "robot-bus"
version = "0.1.6"
edition = "2024"
description = "ZeroMQ message bus: broker routing and participant SDK"
license = "Apache-2.0"
authors = ["deng_ran <deng_ran@aliyun.com>"]
repository = "https://github.com/indunet/robot-bus"
readme = "README.md"
autobenches = false
# Force-include gitignored pre-generated prost/tonic stubs when present at
# `cargo package` / publish time (run `just gen-rust` first).
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/build.rs",
    "/src/**",
    "/proto/**",
    "/assets/**",
]

[lib]
name = "robot_bus"
crate-type = ["cdylib", "rlib"]

[features]
default = ["grpc", "console"]
# Enable with maturin / `cargo build --features extension-module` for the Python module.
extension-module = ["dep:pyo3", "pyo3/extension-module"]
# gRPC / gRPC-Web gateway (started with RobotBusBroker; on by default).
# Stubs are pre-generated (`just gen-rust`); no protoc at compile time.
# axum is required so gRPC routes can share one listener with the console.
grpc = [
    "dep:tokio",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:tonic-web",
    "dep:tower-http",
    "dep:tokio-stream",
    "dep:http",
    "dep:axum",
]
# Embedded Web console (static UI + REST shim; same port as gRPC when both enabled).
console = [
    "dep:tokio",
    "dep:tokio-stream",
    "dep:axum",
    "dep:rust-embed",
    "dep:mime_guess",
    "dep:tower-http",
    "dep:http",
]
# In-process ROS 2 ↔ robot-bus topic/service/action bridge (requires sourced ROS + linking rcl).
# Not enabled by default — keep core SDK / maturin builds free of ROS.
ros2 = ["dep:rclrs", "dep:rosidl_runtime_rs", "dep:tokio"]
# Typecheck without a real ROS install (rclrs stub).
ros2-shim = ["ros2", "rclrs/use_ros_shim", "rosidl_runtime_rs/use_ros_shim"]

[dependencies]
anyhow = "1"
rclrs = { version = "0.7", optional = true }
rosidl_runtime_rs = { version = "0.6", optional = true }
axum = { version = "0.8", optional = true, default-features = false, features = ["http1", "tokio", "query", "json"] }
clap = { version = "4", features = ["derive"] }
http = { version = "1", optional = true }
log = "0.4"
mime_guess = { version = "2", optional = true }
prost = "0.14"
prost-types = "0.14"
pyo3 = { version = "0.25", optional = true, features = ["abi3-py39"] }
rust-embed = { version = "8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2"
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", optional = true, features = ["sync", "net"] }
tonic = { version = "0.14", optional = true }
tonic-prost = { version = "0.14", optional = true }
tonic-web = { version = "0.14", optional = true }
tower-http = { version = "0.6", optional = true, features = ["cors"] }
ureq = { version = "2", default-features = false, features = ["json"] }
uuid = { version = "1", features = ["v4"] }
zmq = "0.10"

[dev-dependencies]
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tonic = "0.14"
tonic-prost = "0.14"
tokio-stream = "0.1"

[[test]]
name = "grpc_gateway"
path = "tests/grpc_gateway.rs"
required-features = ["grpc"]

[[test]]
name = "grpc_node"
path = "tests/grpc_node.rs"
required-features = ["grpc"]

[[test]]
name = "console_metrics_smoke"
path = "tests/console_metrics_smoke.rs"
required-features = ["console", "grpc"]

[[test]]
name = "rbus_cli_smoke"
path = "tests/rbus_cli_smoke.rs"
required-features = ["console", "grpc"]

[[test]]
name = "topic_type_registry"
path = "tests/topic_type_registry.rs"
required-features = ["console", "grpc"]

[[test]]
name = "bot_sim_session"
path = "tests/bot_sim_session.rs"
required-features = ["console", "grpc"]

[[bin]]
name = "robot_bus_broker"
path = "src/bin/robot_bus_broker.rs"

[[bin]]
name = "rbus"
path = "src/bin/rbus.rs"

[[bin]]
name = "robot_bus_interop"
path = "src/bin/robot_bus_interop.rs"

[[bin]]
name = "robot_bus_perf"
path = "benches/robot_bus_perf/main.rs"
required-features = ["grpc"]

[package.metadata.docs.rs]
features = ["grpc", "console"]
