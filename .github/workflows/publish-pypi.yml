name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check tag matches Cargo.toml and pyproject.toml
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          PY_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)"
          if [ "$TAG" != "$CRATE_VERSION" ] || [ "$TAG" != "$PY_VERSION" ]; then
            echo "Tag ($TAG) must match Cargo.toml ($CRATE_VERSION) and pyproject.toml ($PY_VERSION)"
            exit 1
          fi

      - name: Show versions (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          CRATE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          PY_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)"
          echo "Publishing Cargo.toml=$CRATE_VERSION pyproject.toml=$PY_VERSION from ref=$GITHUB_REF_NAME"

  linux:
    needs: [version-check]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            protoc_zip: protoc-35.1-linux-x86_64.zip
          - runner: ubuntu-24.04-arm
            target: aarch64
            protoc_zip: protoc-35.1-linux-aarch_64.zip
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: auto
          before-script-linux: |
            set -eux
            if command -v yum >/dev/null 2>&1; then
              yum install -y cmake gcc-c++ make curl unzip perl-core
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y cmake gcc-c++ make curl unzip perl
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y cmake g++ make curl unzip
            fi
            curl -fsSL -o /tmp/protoc.zip \
              "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/${{ matrix.platform.protoc_zip }}"
            unzip -o /tmp/protoc.zip -d /usr/local
            protoc --version

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  macos:
    needs: [version-check]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: brew install cmake protobuf

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --release --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-aarch64
          path: dist

  windows:
    needs: [version-check]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install protobuf
        run: choco install protoc -y

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List wheels
        run: ls -la dist

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PIPY_API_KEY }}
