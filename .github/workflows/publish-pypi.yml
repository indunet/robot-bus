# You write the Release notes and Publish on GitHub.
# This workflow publishes wheels to PyPI when that Release is published.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check release tag matches Cargo.toml and pyproject.toml
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG#v}"
          CRATE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          PY_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' bindings/python/pyproject.toml | head -n1)"
          if [ "$TAG" != "$CRATE_VERSION" ] || [ "$TAG" != "$PY_VERSION" ]; then
            echo "Release tag ($TAG) must match Cargo.toml ($CRATE_VERSION) and bindings/python/pyproject.toml ($PY_VERSION)"
            exit 1
          fi

      - name: Show versions (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          CRATE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          PY_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' bindings/python/pyproject.toml | head -n1)"
          echo "Publishing Cargo.toml=$CRATE_VERSION bindings/python/pyproject.toml=$PY_VERSION from ref=$GITHUB_REF_NAME"

  # Host is 22.04 for both arches (same as C++ core). Wheel ABI is still
  # manylinux_2_28 (glibc 2.28), which runs on Humble/22.04 and newer.
  linux:
    needs: [version-check]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            protoc_zip: protoc-35.1-linux-x86_64.zip
          - runner: ubuntu-22.04-arm
            target: aarch64
            protoc_zip: protoc-35.1-linux-aarch_64.zip
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler (host codegen)
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/${{ matrix.platform.protoc_zip }}"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: Generate protobuf stubs (Python + Rust for maturin)
        run: |
          set -eux
          python3 scripts/generate_python_msgs.py
          python3 scripts/generate_rust_msgs.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Build embedded console assets
        run: ./scripts/build_console.sh

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.platform.target }}
          args: --release --out ../../dist
          manylinux: manylinux_2_28
          before-script-linux: |
            set -eux
            # manylinux2014 (CentOS 7) yum hits vault.centos.org; 2_28 is AlmaLinux 8 / dnf.
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y cmake gcc-c++ make
            elif command -v yum >/dev/null 2>&1; then
              yum install -y cmake gcc-c++ make
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y cmake g++ make
            fi
            # protoc not required at compile time (stubs pre-generated on host)

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  macos:
    needs: [version-check]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: brew install cmake

      # Homebrew protobuf tracks latest (now 36.x) and trips EXPECTED_PROTOC_VERSION=35.1.
      - name: Install pinned protoc 35.1
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-osx-aarch_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          /usr/local/bin/protoc --version

      - name: Generate protobuf stubs (Python + Rust for maturin)
        run: |
          set -eux
          python3 scripts/generate_python_msgs.py
          python3 scripts/generate_rust_msgs.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Build embedded console assets
        run: ./scripts/build_console.sh

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: aarch64
          args: --release --out ../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-aarch64
          path: dist

  windows:
    needs: [version-check]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      # Chocolatey protoc tracks latest (now 36.x) and trips EXPECTED_PROTOC_VERSION=35.1.
      # Write a Windows path to GITHUB_PATH so later Python + Git Bash (`command -v protoc`)
      # both see the compiler (build_console.sh included).
      - name: Install pinned protoc 35.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "protoc.zip"
          $dest = Join-Path $env:GITHUB_WORKSPACE ".protoc"
          curl.exe -fsSL -o $zip "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-win64.zip"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $bin = Join-Path $dest "bin"
          $exe = Join-Path $bin "protoc.exe"
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          Add-Content -Path $env:GITHUB_ENV -Value "PROTOC=$exe"
          & $exe --version

      - name: Generate protobuf stubs (Python + Rust for maturin)
        shell: bash
        run: |
          set -eux
          python3 scripts/generate_python_msgs.py
          python3 scripts/generate_rust_msgs.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Build embedded console assets
        shell: bash
        run: ./scripts/build_console.sh

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: x64
          args: --release --out ../../dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List wheels
        run: ls -la dist

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PIPY_API_KEY }}
