# You write the Release notes and Publish on GitHub.
# This workflow publishes the npm package when that Release is published.

name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check release tag matches Cargo.toml / pyproject / package.json
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG#v}"
          CRATE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          PY_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' bindings/python/pyproject.toml | head -n1)"
          NPM_VERSION="$(node -p "require('./bindings/typescript/package.json').version")"
          NATIVE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' bindings/typescript/native/Cargo.toml | head -n1)"
          if [ "$TAG" != "$CRATE_VERSION" ] || [ "$TAG" != "$PY_VERSION" ] || [ "$TAG" != "$NPM_VERSION" ] || [ "$TAG" != "$NATIVE_VERSION" ]; then
            echo "Release tag ($TAG) must match Cargo ($CRATE_VERSION), pyproject ($PY_VERSION), package.json ($NPM_VERSION), native ($NATIVE_VERSION)"
            exit 1
          fi

      - name: Show versions (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Cargo=$(sed -n 's/^version = \"\\(.*\\)\"/\\1/p' Cargo.toml | head -n1)"
          echo "Py=$(sed -n 's/^version = \"\\(.*\\)\"/\\1/p' bindings/python/pyproject.toml | head -n1)"
          echo "Npm=$(node -p "require('./bindings/typescript/package.json').version")"

  build:
    needs: [version-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            protoc_zip: protoc-35.1-linux-x86_64.zip
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            protoc_zip: protoc-35.1-linux-aarch_64.zip
          - host: macos-14
            target: aarch64-apple-darwin
            protoc_zip: protoc-35.1-osx-aarch_64.zip
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            protoc_zip: protoc-35.1-win64.zip
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc / build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y cmake g++ make curl unzip pkg-config libzmq3-dev
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/${{ matrix.protoc_zip }}"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake zeromq

      - name: Install pinned protoc 35.1 (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/${{ matrix.protoc_zip }}"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          /usr/local/bin/protoc --version

      - name: Install pinned protoc 35.1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "protoc.zip"
          $dest = Join-Path $env:GITHUB_WORKSPACE ".protoc"
          curl.exe -fsSL -o $zip "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/${{ matrix.protoc_zip }}"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $bin = Join-Path $dest "bin"
          $exe = Join-Path $bin "protoc.exe"
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          Add-Content -Path $env:GITHUB_ENV -Value "PROTOC=$exe"
          & $exe --version

      - name: Install npm deps
        working-directory: bindings/typescript
        run: npm ci

      - name: Generate TypeScript + Rust protobuf stubs
        shell: bash
        run: |
          set -eux
          python3 scripts/generate_typescript_msgs.py
          python3 scripts/generate_rust_msgs.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Build embedded console assets
        shell: bash
        run: ./scripts/build_console.sh

      - name: Build native addon
        working-directory: bindings/typescript
        run: npx napi build --platform --release --target ${{ matrix.target }} --manifest-path native/Cargo.toml --output-dir .

      - uses: actions/upload-artifact@v4
        with:
          name: napi-${{ matrix.target }}
          path: |
            bindings/typescript/*.node
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json

      - name: Install protobuf compiler (codegen)
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: Install npm deps
        working-directory: bindings/typescript
        run: npm ci

      - name: Generate TypeScript protobuf stubs
        run: python3 scripts/generate_typescript_msgs.py

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/napi-artifacts
          pattern: napi-*
          merge-multiple: true

      - name: Place .node binaries
        run: |
          set -eux
          cp -v /tmp/napi-artifacts/*.node bindings/typescript/ || true
          ls -la bindings/typescript/*.node

      - name: Build TypeScript
        working-directory: bindings/typescript
        run: npm run build:ts

      - name: Publish to npm
        working-directory: bindings/typescript
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
