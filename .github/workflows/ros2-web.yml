name: ROS2 browser acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-chromium:
    name: ${{ matrix.ros_distro }}-python-chromium
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            runner: ubuntu-22.04
            ros_base: ros:humble-ros-base-jammy
          - ros_distro: jazzy
            runner: ubuntu-24.04
            ros_base: ros:jazzy-ros-base-noble
    steps:
      - uses: actions/checkout@v6
      - name: Build ROS environment and SDKs from this checkout
        run: |
          set -o pipefail
          mkdir -p artifacts
          docker build -f examples/ros2_web/Dockerfile \
            --build-arg ROS_BASE="${{ matrix.ros_base }}" \
            -t robot-bus-ros2-web:test . 2>&1 | tee artifacts/build.log
      - name: Run browser through Python bridge to a real ROS peer
        run: |
          set -o pipefail
          docker run --name ros2-web-acceptance --init \
            -e ROBOT_BUS_TEST_COMMIT="${{ github.sha }}" \
            -e ROBOT_BUS_TEST_ROS_DISTRO="${{ matrix.ros_distro }}" \
            robot-bus-ros2-web:test bash test.sh 2>&1 | tee artifacts/container.log
      - name: Collect runtime evidence even after failure
        if: always()
        run: |
          mkdir -p artifacts
          if docker container inspect ros2-web-acceptance >/dev/null 2>&1; then
            docker cp ros2-web-acceptance:/workspace/examples/ros2_web/test-results artifacts/ros2-web
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.ros_distro }}-python-chromium-evidence
          path: artifacts/
          retention-days: 14
