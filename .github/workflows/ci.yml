name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libzmq3-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo test --no-default-features

  python-msgs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install protobuf compiler (match codegen)
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version
      - name: Install protobuf runtime
        run: pip install 'protobuf>=7.35,<8'
      - name: Check generated Python msgs are fresh
        run: |
          python3 scripts/generate_python_msgs.py
          git diff --exit-code -- bindings/python/robot_bus
      - name: Smoke test message round-trip and typed API
        run: |
          PYTHONPATH=bindings/python python3 bindings/python/tests/test_msgs_roundtrip.py
          PYTHONPATH=bindings/python python3 bindings/python/tests/test_typed_api.py

  typescript-msgs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json
      - name: Install protobuf compiler (match codegen)
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version
      - name: Install npm deps
        working-directory: bindings/typescript
        run: npm ci
      - name: Check generated TypeScript stubs are fresh
        run: |
          python3 scripts/generate_typescript_msgs.py
          git diff --exit-code -- bindings/typescript/generated
      - name: Smoke test TypeScript
        working-directory: bindings/typescript
        run: npm test

  cpp:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libzmq3-dev \
            curl unzip ninja-build
      - name: Install protobuf compiler + C++ runtime 35.1
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          sudo ./scripts/install_protobuf_cpp.sh /usr/local
          sudo ldconfig
          protoc --version
          pkg-config --modversion protobuf
      - uses: dtolnay/rust-toolchain@stable
      - name: Check generated C++ msgs are fresh
        run: |
          python3 scripts/generate_cpp_msgs.py
          git diff --exit-code -- bindings/cpp/generated
      - name: Build FFI + msgs + tests
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}
          export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}
          cargo build --release --manifest-path bindings/cpp/native/Cargo.toml
          cmake -S bindings/cpp -B bindings/cpp/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/usr/local \
            -DROBOT_BUS_BUILD_TESTS=ON
          cmake --build bindings/cpp/build --target robot_bus_msgs cpp_tests -j
      - name: Run C++ binding tests
        run: |
          export LD_LIBRARY_PATH=/usr/local/lib:bindings/cpp/native/target/release:bindings/cpp/build:${LD_LIBRARY_PATH:-}
          # Renamed FFI soname expected by linker; create local alias for smoke
          ln -sfn "$(pwd)/bindings/cpp/native/target/release/librobot_bus_c.so" \
            bindings/cpp/build/librobot_bus.so || true
          export DYLD_LIBRARY_PATH="$(pwd)/bindings/cpp/native/target/release:$(pwd)/bindings/cpp/build:${DYLD_LIBRARY_PATH:-}"
          ./bindings/cpp/build/msgs_roundtrip
          ./bindings/cpp/build/timer_spin
          ./bindings/cpp/build/pub_sub_imu
          ./bindings/cpp/build/service_set_bool
          ./bindings/cpp/build/action_fibonacci
