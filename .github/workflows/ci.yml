name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check documentation links and language pairs
        run: python3 scripts/check_docs.py
      - name: Check package versions stay in sync
        run: python3 scripts/check_versions.py

  rust-zmq-desktop:
    name: Bundled ZeroMQ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf compiler
        uses: ./.github/actions/install-protoc
        with:
          key: CPP_PROTOC
      - name: Build and test the bundled libzmq
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_rust_msgs.py
          cargo test -p robot-bus --no-default-features --lib zmq::tests

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip pkg-config
      - name: Install protobuf compiler (codegen)
        uses: ./.github/actions/install-protoc
        with:
          key: CPP_PROTOC
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Rust protobuf stubs
        run: python3 scripts/generate_rust_msgs.py
      - name: Test SDK and headless feature combinations before building web assets
        run: |
          cargo test -p robot-bus --no-default-features
          cargo test -p robot-bus --no-default-features --features broker
          cargo test -p robot-bus --no-default-features --features ws --lib --test ws
          cargo test -p robot-bus --no-default-features --features console-api --lib --test console --test node
          cargo test -p robot-bus --no-default-features --features ws,console-api --lib --test console
      - name: Check reconnect, subscriber backlog and short soak
        timeout-minutes: 5
        env:
          TOKIO_WORKER_THREADS: "2"
        run: |
          set -o pipefail
          mkdir -p target/reliability
          {
            printf 'sha=%s\n' "$GITHUB_SHA"
            uname -a
            rustc --version
            cargo tree --locked -p robot-bus -i zeromq-src
          } > target/reliability/environment.log
          status=0
          cargo test -p robot-bus --no-default-features --features ws,console-api --test ws_reliability \
            -- --nocapture --test-threads=1 2>&1 | tee target/reliability/faults.log || status=1
          cargo test -p robot-bus --no-default-features --features ws,console-api --test ws_reliability \
            -- --ignored --nocapture --test-threads=1 2>&1 | tee target/reliability/soak.log || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-reliability-evidence
          path: target/reliability/
          if-no-files-found: ignore
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Build embedded console assets
        run: ./scripts/build_console.sh
      - run: cargo test -p robot-bus
      - run: cargo test -p robot-bus --no-default-features --features ws,console --lib --test console
      - name: Build Rust examples
        run: cargo build -p robot-bus --examples

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # maturin develop refuses system Python; setup-python does not create a venv.
      - name: Create Python venv
        run: |
          python -m venv .venv
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=${{ github.workspace }}/.venv" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip pkg-config
      - name: Install protobuf compiler (Python codegen)
        uses: ./.github/actions/install-protoc
        with:
          key: GENCODE_PROTOC
      - name: Install protobuf compiler (Rust codegen)
        uses: ./.github/actions/install-protoc
        with:
          key: CPP_PROTOC
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf runtime + maturin
        run: |
          set -a
          source scripts/protobuf-versions.env
          set +a
          pip install "protobuf==${PYTHON_PROTOBUF_FLOOR}" maturin
      - name: Generate Python + Rust protobuf stubs
        run: |
          PROTOC="${ROBOT_BUS_PROTOC_GENCODE}" python3 scripts/generate_python_msgs.py
          PROTOC="${ROBOT_BUS_PROTOC_CPP}" python3 scripts/generate_rust_msgs.py
      - name: Smoke test message round-trip and typed API
        run: |
          PYTHONPATH=bindings/python python3 bindings/python/tests/test_msgs_roundtrip.py
          PYTHONPATH=bindings/python python3 bindings/python/tests/test_typed_api.py
          PYTHONPATH=bindings/python python3 bindings/python/tests/test_ros2_bridge_rpc_wait.py
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Build embedded console assets
        run: ./scripts/build_console.sh
      - name: Build native extension
        run: |
          cd bindings/python
          maturin develop --features extension-module,ws,console,demo-tank --no-default-features
      - name: Native integration tests
        run: |
          python3 bindings/python/tests/test_ws_node.py
          python3 bindings/python/tests/test_inproc_context.py
          python3 bindings/python/tests/test_federation_opts.py
          python3 bindings/python/tests/test_console.py
          python3 bindings/python/tests/test_main_module.py
      - name: Run README and API quick starts
        run: python3 scripts/test_doc_examples.py
      - name: Compile Python examples
        run: |
          python3 -m py_compile \
            examples/topic_imu/python/listener.py \
            examples/topic_imu/python/talker.py \
            examples/service_set_bool/python/server.py \
            examples/service_set_bool/python/client.py \
            examples/action_fibonacci/python/server.py \
            examples/action_fibonacci/python/client.py
      - name: Examples topic smoke
        run: python3 scripts/run_examples_topic_smoke.py

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json
      - name: Install protobuf compiler (match codegen)
        uses: ./.github/actions/install-protoc
        with:
          key: CPP_PROTOC
      - name: Install npm deps
        working-directory: bindings/typescript
        run: npm ci
      - name: Generate TypeScript protobuf stubs
        run: python3 scripts/generate_typescript_msgs.py
      # Pure JS/TS only. napi tests call t.skip unless the addon is present.
      - name: Smoke test TypeScript
        working-directory: bindings/typescript
        run: npm test

  cpp:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config \
            curl unzip ninja-build
      - name: Install protobuf compiler
        uses: ./.github/actions/install-protoc
        with:
          key: CPP_PROTOC
      - name: Install pinned protobuf C++ runtime
        run: |
          set -eux
          sudo ./scripts/install_protobuf_cpp.sh /usr/local
          sudo ldconfig
          protoc --version
          pkg-config --modversion protobuf
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Build embedded console assets
        run: ./scripts/build_console.sh
      - name: Generate C++ + Rust protobuf stubs
        run: |
          python3 scripts/generate_cpp_msgs.py
          python3 scripts/generate_rust_msgs.py
      - name: Build FFI + msgs + tests
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}
          export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}
          cargo build --release --manifest-path bindings/cpp/native/Cargo.toml
          cmake -S bindings/cpp -B bindings/cpp/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/usr/local \
            -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON \
            -DROBOT_BUS_BUILD_TESTS=ON \
            -DROBOT_BUS_BUILD_EXAMPLES=ON
          # Cap jobs: bare `-j` is unlimited under GNU make and OOMs GHA when
          # compiling ~130 protobuf .pb.cc units (exit 143 = SIGTERM).
          cmake --build bindings/cpp/build --target robot_bus_msgs cpp_tests cpp_examples -j2
      - name: Run C++ binding tests
        run: |
          export LD_LIBRARY_PATH=/usr/local/lib:bindings/cpp/native/target/release:bindings/cpp/build:${LD_LIBRARY_PATH:-}
          # Renamed FFI soname expected by linker; create local alias for smoke
          ln -sfn "$(pwd)/bindings/cpp/native/target/release/librobot_bus_c.so" \
            bindings/cpp/build/librobot_bus.so || true
          export DYLD_LIBRARY_PATH="$(pwd)/bindings/cpp/native/target/release:$(pwd)/bindings/cpp/build:${DYLD_LIBRARY_PATH:-}"
          ./bindings/cpp/build/msgs_roundtrip
          ./bindings/cpp/build/timer_spin
          ./bindings/cpp/build/pub_sub_imu
          ./bindings/cpp/build/service_set_bool
          ./bindings/cpp/build/action_fibonacci
          ./bindings/cpp/build/ws_node
          ./bindings/cpp/build/inproc_context
          ./bindings/cpp/build/federation_opts
          ./bindings/cpp/build/node_parameters
          ./bindings/cpp/build/typed_api
          ./bindings/cpp/build/ros2_bridge_stub
          ./bindings/cpp/build/ros2_bridge_diagnostics

  cpp-system-protobuf:
    name: C++ system protobuf (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install distro protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config ninja-build \
            libprotobuf-dev protobuf-compiler
          protoc --version
          pkg-config --modversion protobuf
      - name: Generate stubs with the system compiler and smoke-test them
        run: |
          set -eux
          cmake -S bindings/cpp -B bindings/cpp/build-system \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DROBOT_BUS_BUILD_TESTS=OFF \
            -DROBOT_BUS_BUILD_EXAMPLES=OFF \
            -DROBOT_BUS_GENERATE_MSGS=ON
          cmake --build bindings/cpp/build-system --target msgs_proto_only -j2
          ./bindings/cpp/build-system/msgs_proto_only

  java:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config curl unzip
      - name: Install protobuf compiler (Java codegen)
        uses: ./.github/actions/install-protoc
        with:
          key: GENCODE_PROTOC
      - name: Install protobuf compiler (Rust codegen)
        uses: ./.github/actions/install-protoc
        with:
          key: CPP_PROTOC
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: bindings/java/pom.xml
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Build embedded console assets
        run: ./scripts/build_console.sh
      - name: Generate Rust + Java protobuf stubs
        run: |
          PROTOC="${ROBOT_BUS_PROTOC_CPP}" python3 scripts/generate_rust_msgs.py
          PROTOC="${ROBOT_BUS_PROTOC_GENCODE}" python3 scripts/generate_java_msgs.py
      - name: Build C ABI
        run: cargo build --release --manifest-path bindings/cpp/native/Cargo.toml
      - name: Compile + native tests
        working-directory: bindings/java
        env:
          ROBOT_BUS_NATIVE_DIR: ${{ github.workspace }}/bindings/cpp/native/target/release
        run: mvn -B test

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y cmake g++ make curl unzip pkg-config ninja-build
      - name: Install protobuf compiler (Android codegen)
        uses: ./.github/actions/install-protoc
        with:
          key: GENCODE_PROTOC
      - name: Install protobuf compiler (Rust codegen)
        uses: ./.github/actions/install-protoc
        with:
          key: CPP_PROTOC
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: bindings/java/pom.xml
      - name: Setup Android SDK / NDK
        uses: android-actions/setup-android@v4
      - name: Install NDK 26
        run: |
          sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Build embedded console assets
        run: ./scripts/build_console.sh
      - name: Generate Rust + Java protobuf stubs
        run: |
          PROTOC="${ROBOT_BUS_PROTOC_CPP}" python3 scripts/generate_rust_msgs.py
          # Android embeds lite stubs under bindings/android/generated (gitignored).
          PROTOC="${ROBOT_BUS_PROTOC_GENCODE}" \
            ROBOT_BUS_JAVA_LITE=1 \
            ROBOT_BUS_JAVA_OUT=bindings/android/generated \
            python3 scripts/generate_java_msgs.py
      - name: Build Android jniLibs
        run: ./scripts/build_android_native.sh
        env:
          ANDROID_API_LEVEL: "24"
      # Host JVM unit tests load desktop librobot_bus_c (see just test-android),
      # not the Android ABI .so under jniLibs.
      # This job compiles bindings/java into the AAR. Keep it on every push and
      # pull request; do not limit it to bindings/android paths.
      - name: Build host C ABI (for unit tests)
        run: cargo build --release --manifest-path bindings/cpp/native/Cargo.toml
      - name: Lint, assemble AAR, and unit tests
        working-directory: bindings/android
        env:
          ROBOT_BUS_NATIVE_DIR: ${{ github.workspace }}/bindings/cpp/native/target/release
        run: ./gradlew lintRelease assembleRelease test --no-daemon

  interop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config \
            curl unzip ninja-build
      - name: Install protobuf compiler (C++ / Rust / TypeScript codegen)
        uses: ./.github/actions/install-protoc
        with:
          key: CPP_PROTOC
      - name: Install protobuf compiler (Python / Java codegen)
        uses: ./.github/actions/install-protoc
        with:
          key: GENCODE_PROTOC
      - name: Install pinned protobuf C++ runtime
        run: |
          set -eux
          sudo ./scripts/install_protobuf_cpp.sh /usr/local
          sudo ldconfig
          "$ROBOT_BUS_PROTOC_CPP" --version
          pkg-config --modversion protobuf
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # maturin develop refuses system Python; setup-python does not create a venv.
      - name: Create Python venv
        run: |
          python -m venv .venv
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=${{ github.workspace }}/.venv" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: bindings/java/pom.xml
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Setup Node (console embed + TypeScript SDK)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Build embedded console assets
        run: ./scripts/build_console.sh
      - name: Generate protobuf stubs
        run: |
          PROTOC="${ROBOT_BUS_PROTOC_CPP}" python3 scripts/generate_rust_msgs.py
          PROTOC="${ROBOT_BUS_PROTOC_GENCODE}" python3 scripts/generate_python_msgs.py
          PROTOC="${ROBOT_BUS_PROTOC_GENCODE}" python3 scripts/generate_java_msgs.py
          PROTOC="${ROBOT_BUS_PROTOC_CPP}" python3 scripts/generate_cpp_msgs.py
          PROTOC="${ROBOT_BUS_PROTOC_CPP}" python3 scripts/generate_typescript_msgs.py
      - name: Install Python native extension
        run: |
          set -a
          source scripts/protobuf-versions.env
          set +a
          pip install "protobuf==${PYTHON_PROTOBUF_LATEST_7}" maturin
          cd bindings/python
          maturin develop --features extension-module,ws,console,demo-tank --no-default-features
      - name: Build Rust interop peer
        run: cargo build -p robot-bus --example robot_bus_interop
      - name: Build C ABI + C++ interop peer
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}
          export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}
          cargo build --release --manifest-path bindings/cpp/native/Cargo.toml
          cmake -S bindings/cpp -B bindings/cpp/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/usr/local \
            -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON \
            -DROBOT_BUS_BUILD_TESTS=ON
          cmake --build bindings/cpp/build --target interop_peer -j2
          ln -sfn "$(pwd)/bindings/cpp/native/target/release/librobot_bus_c.so" \
            bindings/cpp/build/librobot_bus.so
      - name: Build Java interop peer
        working-directory: bindings/java
        run: mvn -B test-compile dependency:build-classpath -Dmdep.outputFile=target/interop-classpath.txt
      - name: Build TypeScript native peer
        working-directory: bindings/typescript
        run: |
          npm ci
          npm run build:native
          npm run build:ts
      - name: Test TypeScript including napi addon
        working-directory: bindings/typescript
        env:
          ROBOT_BUS_REQUIRE_NATIVE: "1"
        run: npm test
      - name: Run interop matrix
        env:
          ROBOT_BUS_NATIVE_DIR: ${{ github.workspace }}/bindings/cpp/native/target/release
          LD_LIBRARY_PATH: /usr/local/lib:${{ github.workspace }}/bindings/cpp/native/target/release:${{ github.workspace }}/bindings/cpp/build
        run: python3 tests/interop/run.py

  protobuf-compat:
    name: Protobuf runtime compatibility
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install protobuf compiler (codegen)
        uses: ./.github/actions/install-protoc
        with:
          key: GENCODE_PROTOC
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: bindings/java/pom.xml
      - name: Python gencode against floor, latest 6.x, and latest 7.x
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source scripts/protobuf-versions.env
          set +a
          python3 scripts/generate_python_msgs.py
          for ver in "$PYTHON_PROTOBUF_FLOOR" "$PYTHON_PROTOBUF_LATEST_6" "$PYTHON_PROTOBUF_LATEST_7"; do
            echo "python protobuf ${ver}"
            python3 -m venv "/tmp/pb-${ver}"
            "/tmp/pb-${ver}/bin/pip" install -q "protobuf==${ver}"
            PYTHONPATH=bindings/python "/tmp/pb-${ver}/bin/python" bindings/python/tests/test_msgs_roundtrip.py
            PYTHONPATH=bindings/python "/tmp/pb-${ver}/bin/python" bindings/python/tests/test_typed_api.py
          done
      - name: Java gencode against floor, 6.x line, and 7.x line
        working-directory: bindings/java
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source ../../scripts/protobuf-versions.env
          set +a
          python3 ../../scripts/generate_java_msgs.py
          for ver in "$JAVA_PROTOBUF_FLOOR" "$JAVA_PROTOBUF_LATEST_6" "$JAVA_PROTOBUF_LATEST_7"; do
            echo "protobuf-java ${ver}"
            mvn -B -Dprotobuf.version="${ver}" -Dtest=MsgsRoundtripTest test
          done
