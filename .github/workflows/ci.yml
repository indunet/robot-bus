name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip libzmq3-dev pkg-config
      - name: Install protobuf compiler (codegen)
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Rust protobuf stubs
        run: python3 scripts/generate_rust_msgs.py
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Build embedded console assets
        run: |
          cd console && pnpm install --frozen-lockfile && pnpm build
          cd .. && ./scripts/sync_console_assets.sh
      - run: cargo test
      - run: cargo test --no-default-features

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install protobuf compiler (match codegen)
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version
      - name: Install protobuf runtime
        run: pip install 'protobuf>=7.35,<8'
      - name: Generate Python protobuf stubs
        run: python3 scripts/generate_python_msgs.py
      - name: Smoke test message round-trip and typed API
        run: |
          PYTHONPATH=bindings/python python3 bindings/python/tests/test_msgs_roundtrip.py
          PYTHONPATH=bindings/python python3 bindings/python/tests/test_typed_api.py

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json
      - name: Install protobuf compiler (match codegen)
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version
      - name: Install npm deps
        working-directory: bindings/typescript
        run: npm ci
      - name: Generate TypeScript protobuf stubs
        run: python3 scripts/generate_typescript_msgs.py
      - name: Smoke test TypeScript
        working-directory: bindings/typescript
        run: npm test

  cpp:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config libzmq3-dev \
            curl unzip ninja-build
      - name: Install protobuf compiler + C++ runtime 35.1
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          sudo ./scripts/install_protobuf_cpp.sh /usr/local
          sudo ldconfig
          protoc --version
          pkg-config --modversion protobuf
      - uses: dtolnay/rust-toolchain@stable
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Build embedded console assets
        run: |
          cd console && pnpm install --frozen-lockfile && pnpm build
          cd .. && ./scripts/sync_console_assets.sh
      - name: Generate C++ + Rust protobuf stubs
        run: |
          python3 scripts/generate_cpp_msgs.py
          python3 scripts/generate_rust_msgs.py
      - name: Build FFI + msgs + tests
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}
          export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}
          cargo build --release --manifest-path bindings/cpp/native/Cargo.toml
          cmake -S bindings/cpp -B bindings/cpp/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/usr/local \
            -DROBOT_BUS_BUILD_TESTS=ON
          # Cap jobs: bare `-j` is unlimited under GNU make and OOMs GHA when
          # compiling ~130 protobuf .pb.cc units (exit 143 = SIGTERM).
          cmake --build bindings/cpp/build --target robot_bus_msgs cpp_tests -j2
      - name: Run C++ binding tests
        run: |
          export LD_LIBRARY_PATH=/usr/local/lib:bindings/cpp/native/target/release:bindings/cpp/build:${LD_LIBRARY_PATH:-}
          # Renamed FFI soname expected by linker; create local alias for smoke
          ln -sfn "$(pwd)/bindings/cpp/native/target/release/librobot_bus_c.so" \
            bindings/cpp/build/librobot_bus.so || true
          export DYLD_LIBRARY_PATH="$(pwd)/bindings/cpp/native/target/release:$(pwd)/bindings/cpp/build:${DYLD_LIBRARY_PATH:-}"
          ./bindings/cpp/build/msgs_roundtrip
          ./bindings/cpp/build/timer_spin
          ./bindings/cpp/build/pub_sub_imu
          ./bindings/cpp/build/service_set_bool
          ./bindings/cpp/build/action_fibonacci
          ./bindings/cpp/build/grpc_node
          ./bindings/cpp/build/ros2_bridge_stub

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: bindings/java/pom.xml
      - name: Install protobuf compiler (match codegen)
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version
      - name: Generate Java protobuf stubs
        run: python3 scripts/generate_java_msgs.py
      - name: Compile + msgs round-trip test
        working-directory: bindings/java
        run: mvn -B -Dtest=MsgsRoundtripTest test

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y cmake g++ make curl unzip pkg-config ninja-build libzmq3-dev
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: bindings/java/pom.xml
      - name: Setup Android SDK / NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK 26
        run: |
          sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Build embedded console assets
        run: |
          cd console && pnpm install --frozen-lockfile && pnpm build
          cd .. && ./scripts/sync_console_assets.sh
      - name: Generate Rust + Java protobuf stubs
        run: |
          python3 scripts/generate_rust_msgs.py
          # Android embeds stubs under bindings/android/generated (gitignored).
          ROBOT_BUS_JAVA_OUT=bindings/android/generated python3 scripts/generate_java_msgs.py
      - name: Build Android jniLibs
        run: ./scripts/build_android_native.sh
        env:
          ANDROID_API_LEVEL: "24"
      # Host JVM unit tests load desktop librobot_bus_c (see just test-android),
      # not the Android ABI .so under jniLibs.
      - name: Build host C ABI (for unit tests)
        run: cargo build --release --manifest-path bindings/cpp/native/Cargo.toml
      - name: Assemble AAR + unit tests
        working-directory: bindings/android
        env:
          ROBOT_BUS_NATIVE_DIR: ${{ github.workspace }}/bindings/cpp/native/target/release
        run: ./gradlew assembleRelease test --no-daemon
