# You write the Release notes and Publish on GitHub.
# This workflow publishes the Rust crate when that Release is published.

name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip pkg-config

      - name: Install protobuf compiler (codegen)
        uses: ./.github/actions/install-protoc
        with:
          key: CPP_PROTOC

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Rust protobuf stubs
        run: python3 scripts/generate_rust_msgs.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Build embedded console assets
        run: ./scripts/build_console.sh

      - name: Check release tag matches Cargo.toml version
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG#v}"
          CRATE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$TAG" != "$CRATE_VERSION" ]; then
            echo "Release tag ($TAG) does not match Cargo.toml version ($CRATE_VERSION)"
            exit 1
          fi

      - name: Show version (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          CRATE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "Publishing Cargo.toml=$CRATE_VERSION from ref=$GITHUB_REF_NAME"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # Stubs under crates/robot-bus-msgs/src/generated/** are gitignored and
        # regenerated above. Each crate's `include` ships them, so the tree is
        # dirty by design. Publish in dependency order and wait for the index.
        run: |
          set -eux
          # crates.io rejects clients that only name the HTTP library.
          # curl's default User-Agent gets HTTP 403, which is not "not published yet".
          UA="robot-bus-publish (https://github.com/indunet/robot-bus)"
          crate_status() {
            local name="$1" ver="$2"
            curl -sS -o /dev/null -w '%{http_code}' -A "$UA" \
              "https://crates.io/api/v1/crates/${name}/${ver}" || echo 000
          }
          wait_crate() {
            local name="$1" ver="$2" code
            for _ in $(seq 1 60); do
              code="$(crate_status "$name" "$ver")"
              case "$code" in
                200) return 0 ;;
                404) ;;
                403|401)
                  echo "crates.io rejected the version check for ${name} ${ver} (HTTP ${code})" >&2
                  return 1
                  ;;
                *) echo "waiting for ${name} ${ver} (HTTP ${code})" >&2 ;;
              esac
              sleep 10
            done
            echo "timed out waiting for ${name} ${ver}" >&2
            return 1
          }
          publish_crate() {
            local name="$1" ver="$2"
            if [ "$(crate_status "$name" "$ver")" = "200" ]; then
              echo "${name} ${ver} is already on crates.io; skipping publish"
              return 0
            fi
            cargo publish -p "$name" --allow-dirty
            wait_crate "$name" "$ver"
          }
          VER="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          publish_crate robot-bus-msgs "$VER"
          publish_crate robot-bus "$VER"
