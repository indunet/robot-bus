name: Publish to crates.io

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip libzmq3-dev pkg-config

      - name: Install protobuf compiler (codegen)
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Rust protobuf stubs
        run: python3 scripts/generate_rust_msgs.py

      - name: Check tag matches Cargo.toml version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$TAG" != "$CRATE_VERSION" ]; then
            echo "Tag version ($TAG) does not match Cargo.toml version ($CRATE_VERSION)"
            exit 1
          fi

      - name: Show version (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          CRATE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "Publishing Cargo.toml=$CRATE_VERSION from ref=$GITHUB_REF_NAME"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
