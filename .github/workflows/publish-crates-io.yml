# You write the Release notes and Publish on GitHub.
# This workflow publishes the Rust crate when that Release is published.

name: Publish to crates.io

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip libzmq3-dev pkg-config

      - name: Install protobuf compiler (codegen)
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Rust protobuf stubs
        run: python3 scripts/generate_rust_msgs.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Build embedded console assets
        run: ./scripts/build_console.sh

      - name: Check release tag matches Cargo.toml version
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG#v}"
          CRATE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "$TAG" != "$CRATE_VERSION" ]; then
            echo "Release tag ($TAG) does not match Cargo.toml version ($CRATE_VERSION)"
            exit 1
          fi

      - name: Show version (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          CRATE_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "Publishing Cargo.toml=$CRATE_VERSION from ref=$GITHUB_REF_NAME"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # Stubs under crates/robot-bus-msgs/src/generated/** are gitignored and
        # regenerated above. Each crate's `include` ships them, so the tree is
        # dirty by design. Publish in dependency order and wait for the index.
        run: |
          set -eux
          wait_crate() {
            local name="$1" ver="$2"
            for _ in $(seq 1 60); do
              if curl -fsS "https://crates.io/api/v1/crates/${name}/${ver}" >/dev/null; then
                return 0
              fi
              sleep 10
            done
            echo "timed out waiting for ${name} ${ver}" >&2
            return 1
          }
          VER="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          cargo publish -p robot-bus-msgs --allow-dirty
          wait_crate robot-bus-msgs "$VER"
          cargo publish -p robot-bus --allow-dirty
          wait_crate robot-bus "$VER"
          cargo publish -p robot-bus-broker --allow-dirty
