name: Release C++ packages

# You write the Release notes and Publish on GitHub.
# This workflow only builds MSI/DEB/PKG assets and uploads them — it never
# creates or edits the Release body.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to (e.g. v0.0.8)"
        required: true
        type: string

permissions:
  contents: write

env:
  PROTOC_VERSION: "35.1"

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
            protoc_zip: protoc-35.1-linux-x86_64.zip
          - runner: ubuntu-24.04-arm
            arch: arm64
            protoc_zip: protoc-35.1-linux-aarch_64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version / tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ pkg-config libzmq3-dev \
            curl unzip ninja-build

      - name: Install pinned protoc + C++ runtime
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${{ matrix.protoc_zip }}"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          sudo ./scripts/install_protobuf_cpp.sh /usr/local
          sudo ldconfig
          protoc --version
          pkg-config --modversion protobuf

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Build embedded console assets
        run: ./scripts/build_console.sh

      - name: Generate C++ + Rust protobuf stubs
        run: |
          python3 scripts/generate_cpp_msgs.py
          python3 scripts/generate_rust_msgs.py

      - name: Build install tree
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}
          export CMAKE_PREFIX_PATH=/usr/local
          ./scripts/build_cpp_install_tree.sh /tmp/robot-bus-stage "${{ steps.meta.outputs.version }}"
          # Bundle matching protobuf / abseil shared libs into the package
          mkdir -p /tmp/robot-bus-stage/usr/lib
          cp -a /usr/local/lib/libprotobuf.so* /tmp/robot-bus-stage/usr/lib/ || true
          cp -a /usr/local/lib/libabsl*.so* /tmp/robot-bus-stage/usr/lib/ || true
          # Also copy from lib64 if present
          cp -a /usr/local/lib64/libprotobuf.so* /tmp/robot-bus-stage/usr/lib/ 2>/dev/null || true
          cp -a /usr/local/lib64/libabsl*.so* /tmp/robot-bus-stage/usr/lib/ 2>/dev/null || true

      - name: Package DEB
        run: |
          ./scripts/package_deb.sh \
            "${{ steps.meta.outputs.version }}" \
            "${{ matrix.arch }}" \
            /tmp/robot-bus-stage \
            "robot-bus_${{ steps.meta.outputs.version }}_linux_${{ matrix.arch }}.deb"

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" \
            "robot-bus_${{ steps.meta.outputs.version }}_linux_${{ matrix.arch }}.deb" \
            --clobber

  # ROS 2 bridge packages (system rcl; does not vendor /opt/ros).
  linux-ros2:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
            distro: humble
            protoc_zip: protoc-35.1-linux-x86_64.zip
          - runner: ubuntu-24.04
            arch: amd64
            distro: jazzy
            protoc_zip: protoc-35.1-linux-x86_64.zip
          - runner: ubuntu-22.04-arm
            arch: arm64
            distro: humble
            protoc_zip: protoc-35.1-linux-aarch_64.zip
          - runner: ubuntu-24.04-arm
            arch: arm64
            distro: jazzy
            protoc_zip: protoc-35.1-linux-aarch_64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version / tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ pkg-config libzmq3-dev \
            curl unzip ninja-build gnupg lsb-release

      - name: Install ROS 2 ${{ matrix.distro }}
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.distro }}

      - name: Install ROS build/runtime deps for bridge
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            "ros-${{ matrix.distro }}-rcl" \
            "ros-${{ matrix.distro }}-std-msgs" \
            "ros-${{ matrix.distro }}-sensor-msgs" \
            "ros-${{ matrix.distro }}-std-srvs" \
            "ros-${{ matrix.distro }}-example-interfaces" \
            "ros-${{ matrix.distro }}-test-msgs" \
            "ros-${{ matrix.distro }}-rmw-fastrtps-cpp"

      - name: Install pinned protoc + C++ runtime
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${{ matrix.protoc_zip }}"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          sudo ./scripts/install_protobuf_cpp.sh /usr/local
          sudo ldconfig
          protoc --version
          pkg-config --modversion protobuf

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Build embedded console assets
        run: ./scripts/build_console.sh

      - name: Generate C++ + Rust protobuf stubs
        run: |
          python3 scripts/generate_cpp_msgs.py
          python3 scripts/generate_rust_msgs.py

      - name: Build install tree (ros2)
        run: |
          set -eux
          # ament setup scripts reference optional unset vars; don't trip nounset.
          set +u
          source "/opt/ros/${{ matrix.distro }}/setup.bash"
          set -u
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}
          export CMAKE_PREFIX_PATH=/usr/local
          export ROBOT_BUS_ROS2=1
          ./scripts/build_cpp_install_tree.sh /tmp/robot-bus-stage-ros2 "${{ steps.meta.outputs.version }}"
          mkdir -p /tmp/robot-bus-stage-ros2/usr/lib
          cp -a /usr/local/lib/libprotobuf.so* /tmp/robot-bus-stage-ros2/usr/lib/ || true
          cp -a /usr/local/lib/libabsl*.so* /tmp/robot-bus-stage-ros2/usr/lib/ || true
          cp -a /usr/local/lib64/libprotobuf.so* /tmp/robot-bus-stage-ros2/usr/lib/ 2>/dev/null || true
          cp -a /usr/local/lib64/libabsl*.so* /tmp/robot-bus-stage-ros2/usr/lib/ 2>/dev/null || true
          # Guard: must not vendor ROS
          test ! -d /tmp/robot-bus-stage-ros2/opt/ros
          ! find /tmp/robot-bus-stage-ros2 -name 'librcl.so*' | grep -q .

      - name: Package DEB (ros2-${{ matrix.distro }})
        run: |
          ./scripts/package_deb.sh \
            "${{ steps.meta.outputs.version }}" \
            "${{ matrix.arch }}" \
            /tmp/robot-bus-stage-ros2 \
            "robot-bus-ros2-${{ matrix.distro }}_${{ steps.meta.outputs.version }}_linux_${{ matrix.arch }}.deb" \
            "ros2-${{ matrix.distro }}"

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" \
            "robot-bus-ros2-${{ matrix.distro }}_${{ steps.meta.outputs.version }}_linux_${{ matrix.arch }}.deb" \
            --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version / tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      # Windows previously mixed Chocolatey protoc with unpinned vcpkg
      # libprotobuf (currently ~33.4), which trips the generated-header
      # PROTOBUF_VERSION guard. Pin both sides to PROTOC_VERSION like Linux/macOS.
      # protoc must be on PATH before build_console.sh (TypeScript codegen).
      - name: Install pinned protoc ${{ env.PROTOC_VERSION }}
        shell: bash
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-win64.zip"
          rm -rf /c/protoc
          mkdir -p /c/protoc
          unzip -o /tmp/protoc.zip -d /c/protoc
          echo "/c/protoc/bin" >> "$GITHUB_PATH"
          /c/protoc/bin/protoc.exe --version

      - name: Build embedded console assets
        shell: bash
        run: ./scripts/build_console.sh

      - name: Install WiX
        shell: bash
        run: choco install wixtoolset -y

      - name: Install pinned protobuf C++ runtime ${{ env.PROTOC_VERSION }}
        shell: bash
        run: |
          set -eux
          PREFIX="${GITHUB_WORKSPACE}/protobuf-prefix"
          ./scripts/install_protobuf_cpp.sh "$PREFIX"
          echo "PROTOBUF_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"

      - name: Install libzmq (vcpkg)
        shell: bash
        run: |
          set -eux
          # windows-latest often already has vcpkg at VCPKG_INSTALLATION_ROOT / C:/vcpkg
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] && [ -d "$VCPKG_INSTALLATION_ROOT" ]; then
            VCPKG_ROOT="$VCPKG_INSTALLATION_ROOT"
          elif [ -d "C:/vcpkg" ]; then
            VCPKG_ROOT="C:/vcpkg"
          else
            git clone --depth 1 https://github.com/Microsoft/vcpkg.git C:/vcpkg
            VCPKG_ROOT="C:/vcpkg"
          fi
          if [ ! -x "$VCPKG_ROOT/vcpkg.exe" ] && [ ! -x "$VCPKG_ROOT/vcpkg" ]; then
            if [ -f "$VCPKG_ROOT/bootstrap-vcpkg.bat" ]; then
              cmd.exe //c "cd /d ${VCPKG_ROOT} && bootstrap-vcpkg.bat"
            else
              "$VCPKG_ROOT/bootstrap-vcpkg.sh"
            fi
          fi
          # zeromq only — do NOT install vcpkg protobuf (version ≠ 35.1).
          "$VCPKG_ROOT/vcpkg" install zeromq:x64-windows
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          echo "$VCPKG_ROOT/installed/x64-windows/bin" >> "$GITHUB_PATH"
          echo "$VCPKG_ROOT/installed/x64-windows/lib" >> "$GITHUB_PATH"

      - name: Generate C++ + Rust protobuf stubs
        shell: bash
        run: |
          set -eux
          export PROTOC="/c/protoc/bin/protoc.exe"
          "$PROTOC" --version
          python3 scripts/generate_cpp_msgs.py
          python3 scripts/generate_rust_msgs.py

      - name: Build broker + FFI
        shell: bash
        run: |
          set -eux
          cargo build --release --bin robot_bus_broker
          cargo build --release --manifest-path bindings/cpp/native/Cargo.toml

      - name: Build msgs (CMake)
        shell: bash
        run: |
          set -eux
          # msgs only needs the pinned protobuf prefix — do not use the vcpkg
          # toolchain here (vcpkg's protobuf is a different major and would win).
          # windows-latest (mid-2026+) has VS 2026 only; windows-2022 still has VS 2022.
          VSROOT="/c/Program Files/Microsoft Visual Studio"
          if [ -d "$VSROOT/18" ]; then
            VS_GEN="Visual Studio 18 2026"
          elif [ -d "$VSROOT/2022" ]; then
            VS_GEN="Visual Studio 17 2022"
          else
            echo "error: no Visual Studio install found under $VSROOT" >&2
            exit 1
          fi
          echo "Using CMake generator: ${VS_GEN}"
          # CONFIG mode is required so Abseil INTERFACE deps + ABSL_CONSUME_DLL
          # propagate; MODULE FindProtobuf alone causes LNK2001 on MSVC.
          cmake -S bindings/cpp -B bindings/cpp/build-win \
            -G "$VS_GEN" -A x64 \
            -DROBOT_BUS_BUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="${PROTOBUF_PREFIX}" \
            -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON
          cmake --build bindings/cpp/build-win --config Release --target robot_bus_msgs -j2

      - name: Stage install tree
        shell: bash
        run: |
          set -eux
          STAGE=/tmp/robot-bus-msi
          rm -rf "$STAGE"
          mkdir -p "$STAGE/bin" "$STAGE/lib" "$STAGE/include" \
            "$STAGE/lib/cmake/robot_bus" "$STAGE/lib/pkgconfig"
          cp target/release/robot_bus_broker.exe "$STAGE/bin/"
          cp bindings/cpp/native/target/release/robot_bus_c.dll "$STAGE/bin/robot_bus.dll"
          cp bindings/cpp/native/target/release/robot_bus_c.dll.lib "$STAGE/lib/robot_bus.lib" 2>/dev/null || true
          # msgs dll
          find bindings/cpp/build-win -name 'robot_bus_msgs.dll' -exec cp {} "$STAGE/bin/" \;
          find bindings/cpp/build-win -name 'robot_bus_msgs.lib' -exec cp {} "$STAGE/lib/" \; || true
          # Bundle matching protobuf / abseil from the pinned prefix + zeromq from vcpkg
          cp "$PROTOBUF_PREFIX"/bin/libprotobuf*.dll "$STAGE/bin/" 2>/dev/null || true
          cp "$PROTOBUF_PREFIX"/bin/*protobuf*.dll "$STAGE/bin/" 2>/dev/null || true
          # Shared Abseil on Windows is a single abseil_dll.dll (plus any absl_*.dll).
          cp "$PROTOBUF_PREFIX"/bin/abseil_dll.dll "$STAGE/bin/" 2>/dev/null || true
          cp "$PROTOBUF_PREFIX"/bin/abseil*.dll "$STAGE/bin/" 2>/dev/null || true
          cp "$PROTOBUF_PREFIX"/bin/absl*.dll "$STAGE/bin/" 2>/dev/null || true
          cp "$VCPKG_ROOT"/installed/x64-windows/bin/libzmq*.dll "$STAGE/bin/" || true
          ls -la "$STAGE/bin/"
          test -f "$STAGE/bin/robot_bus_msgs.dll"
          cp -a bindings/cpp/include/. "$STAGE/include/"
          cp -a bindings/cpp/generated/robot_bus "$STAGE/include/"
          # CMake / pkg-config so installed SDK is usable for app development
          VERSION="${{ steps.meta.outputs.version }}"
          sed -e "s|@CMAKE_INSTALL_PREFIX@|C:/Program Files/robot-bus|g" \
              -e "s|@CMAKE_INSTALL_LIBDIR@|lib|g" \
              -e "s|@CMAKE_INSTALL_INCLUDEDIR@|include|g" \
              -e "s|@PROJECT_VERSION@|${VERSION}|g" \
              bindings/cpp/cmake/robot_bus.pc.in >"$STAGE/lib/pkgconfig/robot_bus.pc"
          sed -e 's/@PACKAGE_INIT@//' \
              -e 's|\${PACKAGE_PREFIX_DIR}|C:/Program Files/robot-bus|g' \
              bindings/cpp/cmake/robot_busConfig.cmake.in \
              >"$STAGE/lib/cmake/robot_bus/robot_busConfig.cmake"

      - name: Build MSI
        shell: bash
        run: |
          set -eux
          export PATH="/c/Program Files (x86)/WiX Toolset v3.14/bin:$PATH"
          export PATH="/c/Program Files (x86)/WiX Toolset v3.11/bin:$PATH"
          ./scripts/package_msi.sh \
            "${{ steps.meta.outputs.version }}" \
            /tmp/robot-bus-msi \
            "robot-bus_${{ steps.meta.outputs.version }}_windows_x64.msi"

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" \
            "robot-bus_${{ steps.meta.outputs.version }}_windows_x64.msi" \
            --clobber

  macos:
    # Apple Silicon only (M-series / macos_arm64).
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version / tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          brew install cmake pkg-config zeromq ninja
          brew unlink protobuf 2>/dev/null || true

      - name: Install pinned protoc + C++ runtime
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-osx-aarch_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          sudo ./scripts/install_protobuf_cpp.sh /usr/local
          export PATH="/usr/local/bin:$PATH"
          protoc --version
          pkg-config --modversion protobuf

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Build embedded console assets
        run: ./scripts/build_console.sh

      - name: Generate C++ + Rust protobuf stubs
        run: |
          export PATH="/usr/local/bin:$PATH"
          python3 scripts/generate_cpp_msgs.py
          python3 scripts/generate_rust_msgs.py

      - name: Build install tree
        run: |
          set -eux
          export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/opt/homebrew/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CMAKE_PREFIX_PATH="/usr/local;/opt/homebrew"
          export LIBRARY_PATH="/usr/local/lib:/opt/homebrew/lib:${LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="/usr/local/lib:/opt/homebrew/lib:${DYLD_LIBRARY_PATH:-}"
          ./scripts/build_cpp_install_tree.sh /tmp/robot-bus-stage "${{ steps.meta.outputs.version }}"
          # Bundle protobuf / abseil / zeromq dylibs into the package
          mkdir -p /tmp/robot-bus-stage/usr/lib
          for dir in /usr/local/lib /opt/homebrew/lib; do
            cp -a "$dir"/libprotobuf*.dylib /tmp/robot-bus-stage/usr/lib/ 2>/dev/null || true
            cp -a "$dir"/libabsl*.dylib /tmp/robot-bus-stage/usr/lib/ 2>/dev/null || true
            cp -a "$dir"/libzmq*.dylib /tmp/robot-bus-stage/usr/lib/ 2>/dev/null || true
          done

      - name: Package PKG
        run: |
          ./scripts/package_pkg.sh \
            "${{ steps.meta.outputs.version }}" \
            /tmp/robot-bus-stage \
            "robot-bus_${{ steps.meta.outputs.version }}_macos_arm64.pkg"

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" \
            "robot-bus_${{ steps.meta.outputs.version }}_macos_arm64.pkg" \
            --clobber
