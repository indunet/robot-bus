name: Release C++ packages

# You write the Release notes and Publish on GitHub.
# This workflow only builds MSI/DEB/PKG assets and uploads them — it never
# creates or edits the Release body.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to (e.g. v0.0.8)"
        required: true
        type: string

permissions:
  contents: write

env:
  PROTOC_VERSION: "35.1"

jobs:
  # Core SDK (no ROS). One artifact per arch, both on 22.04 so glibc works
  # on Humble/22.04 and newer (24.04 can load a 22.04 binary; not vice versa).
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
            protoc_zip: protoc-35.1-linux-x86_64.zip
          - runner: ubuntu-22.04-arm
            arch: arm64
            protoc_zip: protoc-35.1-linux-aarch_64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version / tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ pkg-config libzmq3-dev \
            curl unzip ninja-build patchelf binutils

      - name: Install pinned protoc + C++ runtime
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${{ matrix.protoc_zip }}"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          sudo ./scripts/install_protobuf_cpp.sh /usr/local
          sudo ldconfig
          protoc --version
          pkg-config --modversion protobuf

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Build embedded console assets
        run: ./scripts/build_console.sh

      - name: Generate C++ + Rust protobuf stubs
        run: |
          python3 scripts/generate_cpp_msgs.py
          python3 scripts/generate_rust_msgs.py

      - name: Build install tree
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}
          export CMAKE_PREFIX_PATH=/usr/local
          ./scripts/build_cpp_install_tree.sh /tmp/robot-bus-stage "${{ steps.meta.outputs.version }}"
          # Bundle matching protobuf / abseil shared libs into the package
          mkdir -p /tmp/robot-bus-stage/usr/lib
          cp -a /usr/local/lib/libprotobuf.so* /tmp/robot-bus-stage/usr/lib/ || true
          cp -a /usr/local/lib/libabsl*.so* /tmp/robot-bus-stage/usr/lib/ || true
          # Also copy from lib64 if present
          cp -a /usr/local/lib64/libprotobuf.so* /tmp/robot-bus-stage/usr/lib/ 2>/dev/null || true
          cp -a /usr/local/lib64/libabsl*.so* /tmp/robot-bus-stage/usr/lib/ 2>/dev/null || true

      - name: Package DEB
        run: |
          ./scripts/package_deb.sh \
            "${{ steps.meta.outputs.version }}" \
            "${{ matrix.arch }}" \
            /tmp/robot-bus-stage \
            "robot-bus_${{ steps.meta.outputs.version }}_linux_${{ matrix.arch }}.deb"

      - name: Package SDK archive
        env:
          PROTOBUF_PREFIX: /usr/local
        run: |
          ./scripts/package_sdk_archive.sh \
            "${{ steps.meta.outputs.version }}" \
            linux \
            "${{ matrix.arch }}" \
            /tmp/robot-bus-stage \
            "robot-bus-sdk_${{ steps.meta.outputs.version }}_linux_${{ matrix.arch }}.tar.gz"

      - name: Smoke-test the core SDK archive before upload
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          ASSET="robot-bus-sdk_${VERSION}_linux_${{ matrix.arch }}.tar.gz"
          BUILD="$RUNNER_TEMP/sdk-smoke"
          /usr/bin/cmake -S bindings/cpp/sdk-smoke -B "$BUILD" \
            -DROBOT_BUS_VERSION="$VERSION" \
            -DROBOT_BUS_SHA256="$(awk '{print $1}' "$ASSET.sha256")" \
            -DROBOT_BUS_SDK_BASE_URL="file://$PWD"
          /usr/bin/cmake --build "$BUILD" --parallel 2
          /usr/bin/ctest --test-dir "$BUILD" --output-on-failure

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" \
            "robot-bus_${{ steps.meta.outputs.version }}_linux_${{ matrix.arch }}.deb" \
            "robot-bus-sdk_${{ steps.meta.outputs.version }}_linux_${{ matrix.arch }}.tar.gz" \
            "robot-bus-sdk_${{ steps.meta.outputs.version }}_linux_${{ matrix.arch }}.tar.gz.sha256" \
            bindings/cpp/cmake/FetchRobotBus.cmake \
            --clobber

  # ROS 2 bridge packages (system rcl; does not vendor /opt/ros).
  linux-ros2:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
            distro: humble
            protoc_zip: protoc-35.1-linux-x86_64.zip
          - runner: ubuntu-24.04
            arch: amd64
            distro: jazzy
            protoc_zip: protoc-35.1-linux-x86_64.zip
          - runner: ubuntu-22.04-arm
            arch: arm64
            distro: humble
            protoc_zip: protoc-35.1-linux-aarch_64.zip
          - runner: ubuntu-24.04-arm
            arch: arm64
            distro: jazzy
            protoc_zip: protoc-35.1-linux-aarch_64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version / tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ pkg-config libzmq3-dev \
            curl unzip ninja-build gnupg lsb-release patchelf binutils

      # Pre-install so setup-ros skips its unauthenticated GitHub API lookup
      # (rate-limit → empty tag → 404 / curl 22). See ros-tooling/setup-ros#892
      - name: Install ROS 2 apt source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          codename="$(. /etc/os-release && echo "${UBUNTU_CODENAME:-${VERSION_CODENAME}}")"
          version="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest" \
            | grep -F '"tag_name"' | head -n1 | awk -F'"' '{print $4}' || true)"
          version="${version:-1.2.0}"
          deb="ros2-apt-source_${version}.${codename}_all.deb"
          url="https://github.com/ros-infrastructure/ros-apt-source/releases/download/${version}/${deb}"
          echo "Installing ${deb}"
          curl --fail --location --retry 5 --retry-delay 3 -o "/tmp/${deb}" "${url}"
          sudo dpkg -i "/tmp/${deb}"
          rm -f "/tmp/${deb}"
          sudo apt-get update

      - name: Install ROS 2 ${{ matrix.distro }}
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.distro }}

      - name: Install ROS build/runtime deps for bridge
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            "ros-${{ matrix.distro }}-rcl" \
            "ros-${{ matrix.distro }}-std-msgs" \
            "ros-${{ matrix.distro }}-sensor-msgs" \
            "ros-${{ matrix.distro }}-std-srvs" \
            "ros-${{ matrix.distro }}-example-interfaces" \
            "ros-${{ matrix.distro }}-test-msgs" \
            "ros-${{ matrix.distro }}-rmw-fastrtps-cpp"

      - name: Install pinned protoc + C++ runtime
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${{ matrix.protoc_zip }}"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          sudo ./scripts/install_protobuf_cpp.sh /usr/local
          sudo ldconfig
          protoc --version
          pkg-config --modversion protobuf

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Build embedded console assets
        run: ./scripts/build_console.sh

      - name: Generate C++ + Rust protobuf stubs
        run: |
          python3 scripts/generate_cpp_msgs.py
          python3 scripts/generate_rust_msgs.py

      - name: Build install tree (ros2)
        run: |
          set -eux
          # ament setup scripts reference optional unset vars; don't trip nounset.
          set +u
          source "/opt/ros/${{ matrix.distro }}/setup.bash"
          set -u
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}
          export CMAKE_PREFIX_PATH="/usr/local;/opt/ros/${{ matrix.distro }}"
          export ROBOT_BUS_ROS2=1
          ./scripts/build_cpp_install_tree.sh /tmp/robot-bus-stage-ros2 "${{ steps.meta.outputs.version }}"
          mkdir -p /tmp/robot-bus-stage-ros2/usr/lib
          cp -a /usr/local/lib/libprotobuf.so* /tmp/robot-bus-stage-ros2/usr/lib/ || true
          cp -a /usr/local/lib/libabsl*.so* /tmp/robot-bus-stage-ros2/usr/lib/ || true
          cp -a /usr/local/lib64/libprotobuf.so* /tmp/robot-bus-stage-ros2/usr/lib/ 2>/dev/null || true
          cp -a /usr/local/lib64/libabsl*.so* /tmp/robot-bus-stage-ros2/usr/lib/ 2>/dev/null || true
          # Guard: must not vendor ROS
          test ! -d /tmp/robot-bus-stage-ros2/opt/ros
          ! find /tmp/robot-bus-stage-ros2 -name 'librcl.so*' | grep -q .

      - name: Package DEB (ros2-${{ matrix.distro }})
        run: |
          ./scripts/package_deb.sh \
            "${{ steps.meta.outputs.version }}" \
            "${{ matrix.arch }}" \
            /tmp/robot-bus-stage-ros2 \
            "robot-bus-ros2-${{ matrix.distro }}_${{ steps.meta.outputs.version }}_linux_${{ matrix.arch }}.deb" \
            "ros2-${{ matrix.distro }}"

      - name: Package SDK archive (ros2-${{ matrix.distro }})
        env:
          PROTOBUF_PREFIX: /usr/local
        run: |
          ./scripts/package_sdk_archive.sh \
            "${{ steps.meta.outputs.version }}" \
            linux \
            "${{ matrix.arch }}" \
            /tmp/robot-bus-stage-ros2 \
            "robot-bus-sdk-ros2-${{ matrix.distro }}_${{ steps.meta.outputs.version }}_linux_${{ matrix.arch }}.tar.gz" \
            "ros2-${{ matrix.distro }}"

      - name: Smoke-test the ROS 2 SDK archive before upload
        run: |
          set -eo pipefail
          DISTRO="${{ matrix.distro }}"
          source "/opt/ros/$DISTRO/setup.bash"
          VERSION="${{ steps.meta.outputs.version }}"
          ASSET="robot-bus-sdk-ros2-${DISTRO}_${VERSION}_linux_${{ matrix.arch }}.tar.gz"
          BUILD="$RUNNER_TEMP/sdk-smoke"
          /usr/bin/cmake -S bindings/cpp/sdk-smoke -B "$BUILD" \
            -DROBOT_BUS_VERSION="$VERSION" \
            -DROBOT_BUS_ROS2="$DISTRO" \
            -DROBOT_BUS_SHA256="$(awk '{print $1}' "$ASSET.sha256")" \
            -DROBOT_BUS_SDK_BASE_URL="file://$PWD"
          /usr/bin/cmake --build "$BUILD" --parallel 2
          /usr/bin/ctest --test-dir "$BUILD" --output-on-failure

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" \
            "robot-bus-ros2-${{ matrix.distro }}_${{ steps.meta.outputs.version }}_linux_${{ matrix.arch }}.deb" \
            "robot-bus-sdk-ros2-${{ matrix.distro }}_${{ steps.meta.outputs.version }}_linux_${{ matrix.arch }}.tar.gz" \
            "robot-bus-sdk-ros2-${{ matrix.distro }}_${{ steps.meta.outputs.version }}_linux_${{ matrix.arch }}.tar.gz.sha256" \
            bindings/cpp/cmake/FetchRobotBus.cmake \
            --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version / tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      # Windows previously mixed Chocolatey protoc with unpinned vcpkg
      # libprotobuf (currently ~33.4), which trips the generated-header
      # PROTOBUF_VERSION guard. Pin both sides to PROTOC_VERSION like Linux/macOS.
      # protoc must be on PATH before build_console.sh (TypeScript codegen).
      - name: Install pinned protoc ${{ env.PROTOC_VERSION }}
        shell: bash
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-win64.zip"
          rm -rf /c/protoc
          mkdir -p /c/protoc
          unzip -o /tmp/protoc.zip -d /c/protoc
          echo "/c/protoc/bin" >> "$GITHUB_PATH"
          /c/protoc/bin/protoc.exe --version

      - name: Build embedded console assets
        shell: bash
        run: ./scripts/build_console.sh

      - name: Install WiX
        shell: bash
        run: choco install wixtoolset -y

      - name: Install pinned protobuf C++ runtime ${{ env.PROTOC_VERSION }}
        shell: bash
        run: |
          set -eux
          PREFIX="${GITHUB_WORKSPACE}/protobuf-prefix"
          ./scripts/install_protobuf_cpp.sh "$PREFIX"
          echo "PROTOBUF_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "$PREFIX/bin" >> "$GITHUB_PATH"

      - name: Install libzmq (vcpkg)
        shell: bash
        run: |
          set -eux
          # windows-latest often already has vcpkg at VCPKG_INSTALLATION_ROOT / C:/vcpkg
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] && [ -d "$VCPKG_INSTALLATION_ROOT" ]; then
            VCPKG_ROOT="$VCPKG_INSTALLATION_ROOT"
          elif [ -d "C:/vcpkg" ]; then
            VCPKG_ROOT="C:/vcpkg"
          else
            git clone --depth 1 https://github.com/Microsoft/vcpkg.git C:/vcpkg
            VCPKG_ROOT="C:/vcpkg"
          fi
          if [ ! -x "$VCPKG_ROOT/vcpkg.exe" ] && [ ! -x "$VCPKG_ROOT/vcpkg" ]; then
            if [ -f "$VCPKG_ROOT/bootstrap-vcpkg.bat" ]; then
              cmd.exe //c "cd /d ${VCPKG_ROOT} && bootstrap-vcpkg.bat"
            else
              "$VCPKG_ROOT/bootstrap-vcpkg.sh"
            fi
          fi
          # zeromq only — do NOT install vcpkg protobuf (version ≠ 35.1).
          "$VCPKG_ROOT/vcpkg" install zeromq:x64-windows
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          echo "$VCPKG_ROOT/installed/x64-windows/bin" >> "$GITHUB_PATH"
          echo "$VCPKG_ROOT/installed/x64-windows/lib" >> "$GITHUB_PATH"

      - name: Generate C++ + Rust protobuf stubs
        shell: bash
        run: |
          set -eux
          export PROTOC="/c/protoc/bin/protoc.exe"
          "$PROTOC" --version
          python3 scripts/generate_cpp_msgs.py
          python3 scripts/generate_rust_msgs.py

      - name: Build broker + FFI
        shell: bash
        run: |
          set -eux
          cargo build --release --bin robot_bus_broker
          cargo build --release --manifest-path bindings/cpp/native/Cargo.toml

      - name: Build msgs (CMake)
        shell: bash
        run: |
          set -eux
          # msgs only needs the pinned protobuf prefix — do not use the vcpkg
          # toolchain here (vcpkg's protobuf is a different major and would win).
          # windows-latest (mid-2026+) has VS 2026 only; windows-2022 still has VS 2022.
          VSROOT="/c/Program Files/Microsoft Visual Studio"
          if [ -d "$VSROOT/18" ]; then
            VS_GEN="Visual Studio 18 2026"
          elif [ -d "$VSROOT/2022" ]; then
            VS_GEN="Visual Studio 17 2022"
          else
            echo "error: no Visual Studio install found under $VSROOT" >&2
            exit 1
          fi
          echo "Using CMake generator: ${VS_GEN}"
          # CONFIG mode is required so Abseil INTERFACE deps + ABSL_CONSUME_DLL
          # propagate; MODULE FindProtobuf alone causes LNK2001 on MSVC.
          cmake -S bindings/cpp -B bindings/cpp/build-win \
            -G "$VS_GEN" -A x64 \
            -DROBOT_BUS_BUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="${PROTOBUF_PREFIX}" \
            -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON
          cmake --build bindings/cpp/build-win --config Release --target robot_bus_msgs -j2

      - name: Stage install tree
        shell: bash
        run: |
          set -eux
          STAGE=/tmp/robot-bus-msi
          rm -rf "$STAGE"
          mkdir -p "$STAGE/bin" "$STAGE/lib" "$STAGE/include" \
            "$STAGE/lib/cmake/robot_bus" "$STAGE/lib/pkgconfig"
          cp target/release/robot_bus_broker.exe "$STAGE/bin/"
          # The Rust import library embeds the DLL filename.
          cp bindings/cpp/native/target/release/robot_bus_c.dll "$STAGE/bin/"
          cp bindings/cpp/native/target/release/robot_bus_c.dll.lib "$STAGE/lib/robot_bus.lib"
          cp bindings/cpp/build-win/Release/robot_bus_msgs.dll "$STAGE/bin/"
          cp bindings/cpp/build-win/Release/robot_bus_msgs.lib "$STAGE/lib/"
          # Bundle matching protobuf / abseil from the pinned prefix + zeromq from vcpkg
          cp "$PROTOBUF_PREFIX"/bin/libprotobuf*.dll "$STAGE/bin/" 2>/dev/null || true
          cp "$PROTOBUF_PREFIX"/bin/*protobuf*.dll "$STAGE/bin/" 2>/dev/null || true
          # Shared Abseil on Windows is a single abseil_dll.dll (plus any absl_*.dll).
          cp "$PROTOBUF_PREFIX"/bin/abseil_dll.dll "$STAGE/bin/" 2>/dev/null || true
          cp "$PROTOBUF_PREFIX"/bin/abseil*.dll "$STAGE/bin/" 2>/dev/null || true
          cp "$PROTOBUF_PREFIX"/bin/absl*.dll "$STAGE/bin/" 2>/dev/null || true
          cp "$VCPKG_ROOT"/installed/x64-windows/bin/libzmq*.dll "$STAGE/bin/" || true
          ls -la "$STAGE/bin/"
          cp -a bindings/cpp/include/. "$STAGE/include/"
          cp -a bindings/cpp/generated/robot_bus "$STAGE/include/"
          # CMake / pkg-config so installed SDK is usable for app development.
          # The CMake package is relocatable (prefix derived from the file
          # location), which matches Program Files/robot-bus and the zip archive.
          VERSION="${{ steps.meta.outputs.version }}"
          sed -e "s|@CMAKE_INSTALL_PREFIX@|C:/Program Files/robot-bus|g" \
              -e "s|@CMAKE_INSTALL_LIBDIR@|lib|g" \
              -e "s|@CMAKE_INSTALL_INCLUDEDIR@|include|g" \
              -e "s|@PROJECT_VERSION@|${VERSION}|g" \
              bindings/cpp/cmake/robot_bus.pc.in >"$STAGE/lib/pkgconfig/robot_bus.pc"
          ./scripts/stage_robot_bus_cmake_config.sh \
            "$STAGE/lib/cmake/robot_bus" "$VERSION"

      - name: Build MSI
        shell: bash
        run: |
          set -eux
          export PATH="/c/Program Files (x86)/WiX Toolset v3.14/bin:$PATH"
          export PATH="/c/Program Files (x86)/WiX Toolset v3.11/bin:$PATH"
          ./scripts/package_msi.sh \
            "${{ steps.meta.outputs.version }}" \
            /tmp/robot-bus-msi \
            "robot-bus_${{ steps.meta.outputs.version }}_windows_x64.msi"

      - name: Package SDK archive
        shell: bash
        run: |
          set -eux
          test -n "${PROTOBUF_PREFIX:-}"
          test -d "$PROTOBUF_PREFIX"
          ./scripts/package_sdk_archive.sh \
            "${{ steps.meta.outputs.version }}" \
            windows \
            x64 \
            /tmp/robot-bus-msi \
            "robot-bus-sdk_${{ steps.meta.outputs.version }}_windows_x64.zip"

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" \
            "robot-bus_${{ steps.meta.outputs.version }}_windows_x64.msi" \
            "robot-bus-sdk_${{ steps.meta.outputs.version }}_windows_x64.zip" \
            "robot-bus-sdk_${{ steps.meta.outputs.version }}_windows_x64.zip.sha256" \
            bindings/cpp/cmake/FetchRobotBus.cmake \
            --clobber

  macos:
    # Apple Silicon only (M-series / macos_arm64).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version / tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          brew install cmake pkg-config zeromq ninja
          brew unlink protobuf 2>/dev/null || true

      - name: Install pinned protoc + C++ runtime
        run: |
          set -eux
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-osx-aarch_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          sudo ./scripts/install_protobuf_cpp.sh /usr/local
          export PATH="/usr/local/bin:$PATH"
          protoc --version
          pkg-config --modversion protobuf

      - uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node (console embed)
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml

      - name: Build embedded console assets
        run: ./scripts/build_console.sh

      - name: Generate C++ + Rust protobuf stubs
        run: |
          export PATH="/usr/local/bin:$PATH"
          python3 scripts/generate_cpp_msgs.py
          python3 scripts/generate_rust_msgs.py

      - name: Build install tree
        run: |
          set -eux
          export PATH="/usr/local/bin:/opt/homebrew/bin:$PATH"
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/opt/homebrew/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CMAKE_PREFIX_PATH="/usr/local;/opt/homebrew"
          export LIBRARY_PATH="/usr/local/lib:/opt/homebrew/lib:${LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="/usr/local/lib:/opt/homebrew/lib:${DYLD_LIBRARY_PATH:-}"
          ./scripts/build_cpp_install_tree.sh /tmp/robot-bus-stage "${{ steps.meta.outputs.version }}"
          # Bundle protobuf / abseil / zeromq dylibs into the package
          mkdir -p /tmp/robot-bus-stage/usr/lib
          for dir in /usr/local/lib /opt/homebrew/lib; do
            cp -a "$dir"/libprotobuf*.dylib /tmp/robot-bus-stage/usr/lib/ 2>/dev/null || true
            cp -a "$dir"/libabsl*.dylib /tmp/robot-bus-stage/usr/lib/ 2>/dev/null || true
            cp -a "$dir"/libzmq*.dylib /tmp/robot-bus-stage/usr/lib/ 2>/dev/null || true
          done

      - name: Package PKG
        run: |
          ./scripts/package_pkg.sh \
            "${{ steps.meta.outputs.version }}" \
            /tmp/robot-bus-stage \
            "robot-bus_${{ steps.meta.outputs.version }}_macos_arm64.pkg"

      - name: Package SDK archive
        env:
          PROTOBUF_PREFIX: /usr/local
          EXTRA_LIB_DIRS: /opt/homebrew/lib:/usr/local/lib
        run: |
          ./scripts/package_sdk_archive.sh \
            "${{ steps.meta.outputs.version }}" \
            macos \
            arm64 \
            /tmp/robot-bus-stage \
            "robot-bus-sdk_${{ steps.meta.outputs.version }}_macos_arm64.tar.gz"

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" \
            "robot-bus_${{ steps.meta.outputs.version }}_macos_arm64.pkg" \
            "robot-bus-sdk_${{ steps.meta.outputs.version }}_macos_arm64.tar.gz" \
            "robot-bus-sdk_${{ steps.meta.outputs.version }}_macos_arm64.tar.gz.sha256" \
            bindings/cpp/cmake/FetchRobotBus.cmake \
            --clobber

  # Download the core SDK just uploaded above and build a consumer with
  # FetchContent. The runner does not install protobuf, libzmq, or Rust.
  sdk-smoke:
    name: SDK archive smoke (${{ matrix.label }})
    needs: [linux, windows]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            label: linux-amd64
            platform: linux
            arch: amd64
            ext: tar.gz
          - runner: windows-latest
            label: windows-x64
            platform: windows
            arch: x64
            ext: zip
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version / tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install CMake and a C++ compiler
        shell: bash
        run: |
          set -eux
          if [ "${{ matrix.platform }}" = "linux" ]; then
            sudo apt-get update
            sudo apt-get install -y cmake g++ ca-certificates
          fi
          cmake --version

      - name: FetchContent consumer against the release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          ASSET="robot-bus-sdk_${VERSION}_${{ matrix.platform }}_${{ matrix.arch }}.${{ matrix.ext }}"
          DEST="${RUNNER_TEMP}/sdk-assets"
          mkdir -p "$DEST"
          gh release download "$TAG" -p "$ASSET" -p "${ASSET}.sha256" -D "$DEST"
          HASH="$(awk '{print $1}' "$DEST/${ASSET}.sha256")"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$DEST" && echo "${HASH}  ${ASSET}" | sha256sum -c -)
          else
            (cd "$DEST" && echo "${HASH}  ${ASSET}" | shasum -a 256 -c -)
          fi
          # FetchContent accepts an absolute archive path. On Windows, using
          # file:///D:/... makes CMake look for the invalid path /D:/....
          BASE="$DEST"
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            BASE="$(cygpath -am "$DEST")"
          fi
          BUILD="${RUNNER_TEMP}/sdk-smoke-build"
          cmake -S bindings/cpp/sdk-smoke -B "$BUILD" \
            -DROBOT_BUS_VERSION="$VERSION" \
            -DROBOT_BUS_SHA256="$HASH" \
            -DROBOT_BUS_SDK_BASE_URL="$BASE"
          cmake --build "$BUILD" --config Release
          exe=""
          for candidate in \
            "$BUILD/sdk_smoke" \
            "$BUILD/sdk_smoke.exe" \
            "$BUILD/Release/sdk_smoke.exe" \
            "$BUILD/Release/sdk_smoke"
          do
            if [[ -f "$candidate" ]]; then
              exe="$candidate"
              break
            fi
          done
          if [[ -z "$exe" ]]; then
            echo "error: sdk_smoke binary not found" >&2
            find "$BUILD" -type f -name 'sdk_smoke*' >&2 || true
            exit 1
          fi
          "$exe"
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            ldd "$exe" | tee "${RUNNER_TEMP}/sdk-smoke-ldd.txt"
            if ! grep -F libprotobuf "${RUNNER_TEMP}/sdk-smoke-ldd.txt" | grep -F '/_deps/' >/dev/null; then
              echo "error: libprotobuf was not loaded from the SDK archive" >&2
              exit 1
            fi
            if grep -E 'libzmq\.so' "${RUNNER_TEMP}/sdk-smoke-ldd.txt" | grep -vF '/_deps/' >/dev/null; then
              echo "error: shared libzmq was loaded from outside the SDK archive" >&2
              exit 1
            fi
          else
            bindir="$(dirname "$exe")"
            test -f "$bindir/robot_bus_c.dll"
            shopt -s nullglob nocaseglob
            protobuf_dlls=("$bindir"/*protobuf*.dll)
            if [[ ${#protobuf_dlls[@]} -eq 0 ]]; then
              echo "error: protobuf DLL was not copied next to the executable" >&2
              ls -la "$bindir" >&2
              exit 1
            fi
          fi
